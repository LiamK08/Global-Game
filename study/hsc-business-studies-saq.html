<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSC Business Studies — SAQ by Syllabus Point</title>
<style>
/* Colour carries exactly one meaning here: which business function you are in.
   The four hues below are the only saturated colour on the page, and the
   interface borrows the hue of whichever topic is open for its own selected
   states — so the chrome always tells you where you are without a fifth
   competing accent. Neutrals are biased slightly blue to sit under them. */
:root{
  --bg:#f5f6f9; --panel:#fff; --ink:#14171d; --muted:#596273; --line:#e1e4eb;
  --chip:#eceff4; --done:#15803d; --done-soft:#e7f6ec;
  --ops:#0f766e; --ops-soft:#ddf0ed;
  --mkt:#a4530a; --mkt-soft:#fbeddc;
  --fin:#1d4ed8; --fin-soft:#e4ebfd;
  --hr:#8b2fd6;  --hr-soft:#f1e6fd;
  --accent:var(--ink); --accent-soft:var(--chip);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* Questions are set in a serif, the way they are printed on the real paper. */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1115; --panel:#161a20; --ink:#e7eaef; --muted:#949dac; --line:#272d36;
    --chip:#222831; --done:#4ade80; --done-soft:#14301f;
    --ops:#5eead4; --ops-soft:#0e2f2a;
    --mkt:#fbbf24; --mkt-soft:#33270a;
    --fin:#93b4ff; --fin-soft:#18213c;
    --hr:#d8b4fe;  --hr-soft:#28183c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115; --panel:#161a20; --ink:#e7eaef; --muted:#949dac; --line:#272d36;
  --chip:#222831; --done:#4ade80; --done-soft:#14301f;
  --ops:#5eead4; --ops-soft:#0e2f2a;
  --mkt:#fbbf24; --mkt-soft:#33270a;
  --fin:#93b4ff; --fin-soft:#18213c;
  --hr:#d8b4fe;  --hr-soft:#28183c;
  --shadow:none;
}
:root[data-theme="light"]{
  --bg:#f5f6f9; --panel:#fff; --ink:#14171d; --muted:#596273; --line:#e1e4eb;
  --chip:#eceff4; --done:#15803d; --done-soft:#e7f6ec;
  --ops:#0f766e; --ops-soft:#ddf0ed;
  --mkt:#a4530a; --mkt-soft:#fbeddc;
  --fin:#1d4ed8; --fin-soft:#e4ebfd;
  --hr:#8b2fd6;  --hr-soft:#f1e6fd;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
}
/* Set by the topic tabs; must follow the theme blocks so it wins. */
:root[data-topic="operations"]{--accent:var(--ops);--accent-soft:var(--ops-soft)}
:root[data-topic="marketing"]{ --accent:var(--mkt);--accent-soft:var(--mkt-soft)}
:root[data-topic="finance"]{   --accent:var(--fin);--accent-soft:var(--fin-soft)}
:root[data-topic="hr"]{        --accent:var(--hr); --accent-soft:var(--hr-soft)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

header.top{
  position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line);
}
.top-inner{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;margin-right:4px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;
  padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:550; display:flex; gap:7px; align-items:center;
}
.tab:hover{background:var(--chip)}
.tab .n{font-size:11px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tab[aria-selected="true"] .n{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.spacer{flex:1}
.search{
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;
  padding:7px 11px;font-size:13.5px;min-width:220px;
}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.iconbtn{
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
  border-radius:8px;padding:7px 10px;font-size:13px;
}
.iconbtn:hover{background:var(--chip);color:var(--ink)}

.layout{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:940px){ .layout{grid-template-columns:1fr} }

aside{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;
}
@media (max-width:940px){ aside{position:static;max-height:none} }
.aside-head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.aside-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.allbtn{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;
  padding:10px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);
}
.allbtn:hover{background:var(--chip)}
.allbtn.active{background:var(--accent-soft);color:var(--accent)}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec > summary{
  cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:650;letter-spacing:.02em;
  color:var(--muted);text-transform:uppercase;list-style:none;display:flex;gap:8px;align-items:center;
}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::before{content:"▸";font-size:10px;transition:transform .12s;color:var(--muted)}
.sec[open] > summary::before{transform:rotate(90deg)}
.sec > summary:hover{background:var(--chip)}
.pt{
  display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;
  color:var(--ink);cursor:pointer;padding:8px 14px 8px 30px;font-size:13.5px;line-height:1.4;border-left:3px solid transparent;
}
.pt:hover{background:var(--chip)}
.pt.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.pt.empty{color:var(--muted);opacity:.55}
.pt .cnt{margin-left:auto;flex:none;font-size:11px;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.pt.active .cnt{background:var(--panel);color:var(--accent)}
.pt .bar{flex:none;width:34px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden;margin-top:7px}
.pt .bar i{display:block;height:100%;background:var(--done)}

main{min-width:0}
.crumb{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.crumb b{color:var(--ink);font-weight:600}
.pointhead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.pointhead h1{margin:0 0 6px;font-size:19px;line-height:1.3;letter-spacing:-.01em}
.pointhead p{margin:0;color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.filters select,.filters label{font-size:12.5px}
.filters select{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 9px;
}
.filters label{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer;user-select:none}

.q{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);
}
.q.is-done{border-color:var(--done);background:var(--done-soft)}
.q-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.q-num{font-weight:650;font-size:13px;font-variant-numeric:tabular-nums}
.q-src{font-size:12px;color:var(--muted)}
.q-marks{
  margin-left:auto;flex:none;font-size:12px;font-weight:650;background:var(--chip);border-radius:999px;padding:2px 10px;
  font-variant-numeric:tabular-nums;
}
/* The question always renders on white, in both themes — it is a page from an
   exam paper, and a scan and a typeset extract have to sit side by side. */
.paper{
  background:#fff;color:#12151a;border:1px solid #d7dbe2;border-radius:6px;
  padding:18px 20px;margin:0;overflow-x:auto;
}
.paper img{display:block;width:100%;max-width:840px;height:auto;margin:0 auto}
.paper.typeset{font-family:var(--serif)}
.ex-row{display:flex;gap:14px;align-items:baseline}
.ex-num{flex:none;min-width:46px;font-weight:600;font-variant-numeric:tabular-nums}
.ex-text{flex:1;font-size:16px;line-height:1.55;white-space:pre-wrap}
.ex-marks{flex:none;min-width:20px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ex-stim{
  margin:12px 0 0 60px;padding:10px 12px;background:#f3f5f8;border:1px solid #e2e6ec;
  border-radius:4px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;
}
.ex-rules{margin:14px 0 0 60px;display:flex;flex-direction:column;gap:13px}
.ex-rules i{display:block;border-bottom:1px dotted #98a2b0}
.chip.prov{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.chip.prov.scan{background:var(--accent-soft);color:var(--accent)}
.q-stim{
  margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.55;white-space:pre-wrap;
  font-family:var(--serif);max-width:80ch;
}
.q-stim b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.q-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;background:var(--chip);color:var(--muted);border-radius:999px;padding:2px 9px}
.chip.tag{cursor:pointer;border-left:3px solid var(--tc,var(--line));padding-left:8px}
.chip.tag b{color:var(--tc);font-weight:650}
.chip.tag:hover{background:var(--accent-soft);color:var(--accent)}
.donebtn{
  margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
  border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:550;
}
.donebtn:hover{background:var(--chip);color:var(--ink)}
.q.is-done .donebtn{border-color:var(--done);color:var(--done)}
.empty-state{
  background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted);
}
.count-line{font-size:12.5px;color:var(--muted);margin:0 0 10px}
mark{background:#fde68a;color:#111;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){ mark{background:#7c5e00;color:#fff} }
:root[data-theme="dark"] mark{background:#7c5e00;color:#fff}
footer{max-width:1400px;margin:0 auto;padding:8px 16px 40px;color:var(--muted);font-size:12px}
@media print{
  header.top,aside,.filters,.donebtn,footer{display:none!important}
  .layout{display:block;padding:0}
  .q{break-inside:avoid;box-shadow:none;border-color:#ccc}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">HSC Business Studies<small>Short-answer questions by syllabus point</small></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="spacer"></div>
    <input class="search" id="search" type="search" placeholder="Search all questions…" autocomplete="off">
    <button class="iconbtn" id="themebtn" title="Toggle light / dark">Theme</button>
    <button class="iconbtn" id="printbtn" title="Print the questions currently shown">Print</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="aside-head"><h2 id="asideTitle">Syllabus</h2></div>
    <button class="allbtn" id="allbtn">All questions in this topic</button>
    <div id="tree"></div>
  </aside>

  <main>
    <div class="crumb" id="crumb"></div>
    <div class="pointhead">
      <h1 id="ptitle">—</h1>
      <p id="psub"></p>
    </div>
    <div class="filters">
      <select id="fSource"><option value="">All papers</option></select>
      <select id="fMarks">
        <option value="">Any marks</option>
        <option value="1-3">1–3 marks</option>
        <option value="4-5">4–5 marks</option>
        <option value="6-9">6–9 marks</option>
        <option value="10+">10+ marks</option>
      </select>
      <select id="fVerb"><option value="">Any directive verb</option></select>
      <select id="fType">
        <option value="">Short answer + extended</option>
        <option value="short-answer">Short answer only</option>
        <option value="extended-response">Extended response only</option>
      </select>
      <label><input type="checkbox" id="fHideDone"> Hide completed</label>
      <label><input type="checkbox" id="fStim"> Stimulus only</label>
    </div>
    <p class="count-line" id="countline"></p>
    <div id="list"></div>
  </main>
</div>

<footer id="foot"></footer>

ort":"Ethical issues related to financial reports"}],"Financial management strategies":[{"id":"fin-str-cashflow","label":"Cash flow management \u2014 cash flow statements, distribution of payments, discounts for early payment, factoring","short":"Cash flow management"},{"id":"fin-str-workingcapital","label":"Working capital management \u2014 control of current assets and current liabilities, leasing, sale and lease back","short":"Working capital management"},{"id":"fin-str-profitability","label":"Profitability management \u2014 cost controls, revenue controls","short":"Profitability management"},{"id":"fin-str-global","label":"Global financial management \u2014 exchange rates, interest rates, methods of international payment, hedging, derivatives","short":"Global financial management"}]}},"hr":{"label":"Human Resources","sections":{"Role of human resource management":[{"id":"hr-role-strategic","label":"Strategic role of human resource management","short":"Strategic role of human resource management"},{"id":"hr-role-interdependence","label":"Interdependence with other key business functions","short":"Interdependence with other key business functions"},{"id":"hr-role-outsourcing","label":"Outsourcing \u2014 HR functions, using contractors (domestic, global)","short":"Outsourcing"}],"Influences":[{"id":"hr-inf-stakeholders","label":"Stakeholders \u2014 employers, employees, employer associations, unions, government organisations, society","short":"Stakeholders"},{"id":"hr-inf-legal-framework","label":"Legal \u2014 the employment contract, common law, minimum employment standards, awards, enterprise agreements","short":"Legal \u2014 the employment contract"},{"id":"hr-inf-whs","label":"Legal \u2014 work health and safety and workers compensation","short":"Legal \u2014 work health and safety and workers compensation"},{"id":"hr-inf-discrimination","label":"Legal \u2014 anti-discrimination and equal employment opportunity","short":"Legal \u2014 anti-discrimination and equal employment opportunity"},{"id":"hr-inf-economic","label":"Economic influences","short":"Economic influences"},{"id":"hr-inf-technological","label":"Technological influences","short":"Technological influences"},{"id":"hr-inf-social","label":"Social influences \u2014 changing work patterns, living standards","short":"Social influences"},{"id":"hr-inf-ethics","label":"Ethics and corporate social responsibility","short":"Ethics and corporate social responsibility"}],"Processes of human resource management":[{"id":"hr-proc-acquisition","label":"Acquisition","short":"Acquisition"},{"id":"hr-proc-development","label":"Development","short":"Development"},{"id":"hr-proc-maintenance","label":"Maintenance","short":"Maintenance"},{"id":"hr-proc-separation","label":"Separation \u2014 voluntary and involuntary","short":"Separation"}],"Strategies in human resource management":[{"id":"hr-str-leadership","label":"Leadership style","short":"Leadership style"},{"id":"hr-str-jobdesign","label":"Job design \u2014 general or specific tasks","short":"Job design"},{"id":"hr-str-recruitment","label":"Recruitment \u2014 internal or external, general or specific skills","short":"Recruitment"},{"id":"hr-str-training","label":"Training and development \u2014 current or future skills","short":"Training and development"},{"id":"hr-str-performance","label":"Performance management \u2014 developmental or administrative","short":"Performance management"},{"id":"hr-str-rewards","label":"Rewards \u2014 monetary and non-monetary, individual or group, performance pay","short":"Rewards"},{"id":"hr-str-global","label":"Global \u2014 costs, competencies","short":"Global"},{"id":"hr-str-disputes","label":"Workplace disputes \u2014 negotiation, mediation, grievance procedures, courts and tribunals","short":"Workplace disputes"}],"Effectiveness of human resource management":[{"id":"hr-eff-indicators","label":"Indicators \u2014 corporate culture, benchmarking key variables, changes in staff turnover, absenteeism, accidents, levels of disputation, worker satisfaction","short":"Indicators"}]}}},"questions":[{"id":"6bdd077c03","number":"27","text":"Analyse how financial management strategies can be used to improve the cash flow and profitability of a business.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-str-cashflow","fin-str-profitability","fin-str-workingcapital"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"ec73682f87","number":"27","text":"Analyse how financial management strategies can be used to improve financial objectives","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-str-cashflow","fin-str-workingcapital","fin-str-profitability","fin-str-global"],"sources":["Newington Trial 2024"],"kind":"Newington Trial","year":2024},{"id":"65bf26d42a","number":"26","text":"Analyse how human resources management strategies can be used to address increases in staff turnover and improve worker satisfaction.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators","hr-str-rewards","hr-str-training"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"9ab666cc31","number":"26","text":"Analyse how human resources management strategies can be used to improve human resource indicators","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators","hr-str-training","hr-str-rewards","hr-str-performance","hr-str-leadership"],"sources":["Newington Trial 2024"],"kind":"Newington Trial","year":2024},{"id":"0def236f5e","number":"26","text":"Analyse the impact of corporate social responsibility and technological influences on human resource management.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-ethics","hr-inf-technological"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"02016c96a8","number":"27","text":"Analyse the impact of financial management strategies on liquidity and profitability financial objectives.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-str-cashflow","fin-str-workingcapital","fin-str-profitability"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"04736e0d78","number":"27","text":"Assess financial management strategies a business may implement in response to the influences on financial management.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-str-cashflow","fin-str-workingcapital","fin-str-profitability","fin-str-global","fin-inf-debt","fin-inf-equity","fin-inf-government","fin-inf-global"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"cd5d2cacb5","number":"26","text":"Assess marketing strategies a business may implement in response to the influences on marketing.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-product","mkt-str-price","mkt-str-promotion","mkt-str-place","mkt-inf-economic","mkt-inf-sociocultural","mkt-inf-consumerlaws","mkt-inf-ethical"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"6b1058c50e","number":"26","text":"Assess strategies that management can use to respond to influences on finance.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-str-cashflow","fin-str-workingcapital","fin-str-profitability","fin-str-global"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"2c46c13d9f","number":"27","text":"Assess strategies that management can use to respond to influences on operations.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance","ops-str-quality","ops-str-technology","ops-str-global"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"436f510699","number":"27","text":"Assess the significance of effective acquisition and development processes in reducing workplace disputes and increasing worker satisfaction.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-proc-acquisition","hr-proc-development","hr-str-disputes","hr-eff-indicators"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"86dcc041d3","number":"26","text":"Assess the significance of financial management strategies in ensuring the long-term objectives of a business are achieved.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-str-cashflow","fin-str-workingcapital","fin-str-profitability","fin-str-global"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"d9de9896fa","number":"26","text":"Assess the use of financial strategies to improve financial processes.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-str-cashflow","fin-str-workingcapital","fin-str-profitability","fin-str-global","fin-proc-planning","fin-proc-statements"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"15d4bbf4d4","number":"27","text":"Assess the use of operations strategies to improve operations processes.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance","ops-str-supplychain","ops-str-technology","ops-str-inventory","ops-str-quality","ops-proc-monitoring"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"606d7782ea","number":"25","text":"In your report:\n\u2022 Justify an appropriate restaurant (plant) layout for Supreme Pizza\u2019s Ltd (SPL) operations processes.\n\u2022 Explain the importance of establishing marketing objectives and identifying target markets in the marketing process/plan of Supreme Pizza\u2019s Ltd (SPL).\n\u2022 Evaluate TWO global marketing strategies Supreme Pizza\u2019s Ltd (SPL) could use to expand into global markets.","marks":20,"verb":"justify","type":"extended-response","section":"III","stimulus":"Case scenario (business report): Supreme Pizza\u2019s Ltd (SPL) is a chain of Pizza restaurants operating in Australia. The business is facing intense competition in the fast-food industry and has lost significant market share. This is due to high levels of customer complaints concerning the poor quality of Pizzas and the level of service provided in their restaurants. Supreme Pizza\u2019s Ltd (SPL) intends to expand into global markets to overcome the loss of sales in Australia. This would require Supreme Pizza\u2019s Ltd (SPL) to revise the marketing process/plan. The student is employed as a consultant to prepare a report for management of Supreme Pizza\u2019s Ltd (SPL).","topics":["operations","marketing"],"syllabusPoints":["ops-proc-tasklayout","mkt-proc-objectives","mkt-proc-target","mkt-str-global"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"2b6a62ec3b","number":"25","text":"Management of Harmony Co has hired you as a consultant to write a report addressing:\n\u2022 Explain how human resources management is interdependent with marketing.\n\u2022 Demonstrate why monitoring and controlling should be used to manage their marketing processes.\n\u2022 Recommend ONE appropriate marketing strategy to address the business' problems.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Harmony Co is a well-known Australian company specialising in eco-friendly skincare and vitamin supplement products. The company has built a loyal customer base by emphasising natural ingredients and operates 18 stores with a team of 200 employees across product development, retail and customer service. Harmony Co had seen steady sales growth over the past five years, but recent quarters have shown a 15% decline in revenue. They hold a 5% share in the eco-friendly product segment but are concerned about competition from new entrants and established brands. The answer must be presented in the form of a business report.","topics":["hr","marketing"],"syllabusPoints":["hr-role-interdependence","mkt-role-interdependence","mkt-proc-implement","mkt-proc-strategies"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"819e0a8d37","number":"25","text":"The directors have asked you to write a business report in which you:\n- Outline the impact of variation in demand and variety on this business.\n- Discuss a suitable source of finance for this business expansion.\n- Recommend TWO working capital strategies for this business.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Roberto y Carlos Pty Ltd (RYC): the founding partners are shareholders in a national fast food chain franchise. The business currently owns a large head office and 25 out of 200 stores. RYC is popular amongst students and businesspeople for its affordable products and friendly, quick service. They are planning to introduce a new menu with expanded options. RYC is seeking to go global next year and requires significant external funding to support the expansion; an investor has offered the total capital to fund the expansion in return for 51% equity. Other key financial information: current ratio of 0.8:1 (30% lower than the industry average); rent affordability is currently at a 5-year low; current interest rates are high at around 8%.","topics":["operations","finance"],"syllabusPoints":["ops-proc-fourvs","fin-inf-equity","fin-inf-debt","fin-str-workingcapital"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"177ae8ba0d","number":"27","text":"To what extent do human resources strategies impact business objectives?","marks":20,"verb":"to what extent","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-recruitment","hr-str-training","hr-str-performance","hr-str-rewards"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"c642e74d8b","number":"26","text":"To what extent do marketing strategies impact business objectives?","marks":20,"verb":"to what extent","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-product","mkt-str-price","mkt-str-promotion","mkt-str-place"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"25f1513dc9","number":"25","text":"You have been hired as a consultant by Cozy Corner Cafe to write a business report for the owners. In your report:\n\u2022 Outline the advantages and disadvantages of holding stock this business should consider in its operations.\n\u2022 Explain the importance of compliance with work health and safety legislation and workers compensation for this business.\n\u2022 Recommend operations processes that Cozy Corner Cafe can implement to address the concerns of customers.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Cozy Corner Cafe operates a caf\u00e9 in Wahroonga renowned for its coffee and homemade pastries. The business is looking to expand its menu with a new selection of healthy breakfast items. Recent customer feedback has highlighted issues with inconsistent coffee quality and long wait times, prompting the caf\u00e9 to address these concerns. Additionally, employees have raised concerns that the cramped kitchen space poses significant health and safety risks, including a higher likelihood of accidents, difficulties in maintaining cleanliness, and challenges with proper ventilation and fire safety. Answer in the form of a business report.","topics":["operations","hr"],"syllabusPoints":["ops-str-inventory","hr-inf-whs","ops-proc-monitoring","ops-proc-sequencing"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"5c0e1e636d","number":"25","text":"You have been hired as a consultant by Toyland Ltd to write a business report for the owners.\nIn your report:\n\u2022 Outline the interdependence between human resources and marketing at Toyland.\n\u2022 Describe methods this business could use in the acquisition and development of staff.\n\u2022 Discuss global marketing strategies that Toyland could use as it continues to expand globally.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Toyland Ltd is a successful toy manufacturing company that has expanded globally into many countries around the world. Sales revenue has been increasing rapidly, which has placed pressure on their production volumes as they have found it difficult to keep up with demand due to staff shortages. They sell their toys via their website, which allows customers to order directly from them. They are intending on having a once-off 'mega sale' which only applies to purchases made on a specific day next month. Toyland Ltd makes a wide range of toys but has recently been heavily focused on the manufacturing of toy merchandise associated with large blockbuster movies that are targeted towards children.","topics":["hr","marketing"],"syllabusPoints":["hr-role-interdependence","mkt-role-interdependence","hr-proc-acquisition","hr-proc-development","mkt-str-global"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"fa16e310f9","number":"25","text":"You have been hired as a consultant by Zilor to write a business report to the owners. In your report:\n\u2022 Outline how the business could adopt e-marketing and differentiation strategies as part of its marketing plan to improve sales.\n\u2022 Analyse the operations processes required to be implemented by the business to address its goals.\n\u2022 Recommend TWO operations strategies that can help the business to sustain its competitive advantage.","marks":20,"verb":"analyse","type":"extended-response","section":"III","stimulus":"Zilor is a bicycle and scooter manufacturer and retailer. It makes high quality products in Australia. Zilor has built its reputation on innovation and has been operating for 20 years. Despite its past performance, Zilor faces several challenges: falling retail sales the past two years and rising input costs; current marketing efforts have been limited to radio and print media; wholesale competitors are selling cheap imported electric bicycles and scooters. For the first time ever, Zilor is planning to import parts from overseas in order to manufacture and retail electric bicycles and scooters to increase its market share and sales. Responses are assessed as a business report applied to this hypothetical business situation.","topics":["operations","marketing"],"syllabusPoints":["mkt-str-emarketing","mkt-str-segmentation","ops-proc-inputs","ops-proc-fourvs","ops-proc-outputs","ops-str-performance"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"3f8398c236","number":"25","text":"You have been hired as a consultant by management at Kidzglo Pty Ltd to write a business report for the owners.\nIn your report:\n- Outline how Kidzglo can differentiate its products from its competitors.\n- Discuss the quality management approaches that can be used to address the challenges faced by Kidzglo.\n- Recommend TWO appropriate marketing strategies to help this business achieve its marketing objectives.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Kidzglo Pty Ltd is a large business that manufactures and sells children's shoes and clothing. It has been operating successfully in Australia for 5 years with retail shops across the country. The business is facing a number of challenges including: increasing customer complaints about poor quality goods; increasing competition as more online sellers enter the marketplace; and falling sales and declining market share over the past 2 years. Answer is to be presented in the form of a business report.","topics":["operations","marketing"],"syllabusPoints":["ops-str-quality","mkt-str-segmentation","mkt-proc-strategies","mkt-proc-objectives"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"df0dd4a7df","number":"26","text":"Analyse how different sources of finance impact the financial objectives of a business.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-inf-internal","fin-inf-debt","fin-inf-equity"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"169904143e","number":"26","text":"Analyse the influence of corporate social responsibility and globalisation on marketing strategies","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-ethical","mkt-str-global"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"c65c33716d","number":"27","text":"Analyse the influence of government and the global market on financial management strategies.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-inf-government","fin-inf-global","fin-str-global"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"15cb5d9c50","number":"27","text":"Assess the importance of financial management strategies in achieving the objectives of financial management.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-str-cashflow","fin-str-workingcapital","fin-str-profitability"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"2871748564","number":"26","text":"Assess the importance of marketing strategies in achieving the marketing objectives of market share and brand awareness.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-proc-objectives","mkt-str-product","mkt-str-promotion","mkt-str-price"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"782b43e81c","number":"26","text":"Assess the importance of operations strategies in enabling business to achieve the performance objectives.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance","ops-str-quality","ops-str-technology"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"51f16e10ab","number":"27","text":"Assess the importance of operations strategies in achieving the operations objectives of cost and quality.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance","ops-str-quality","ops-str-supplychain","ops-str-technology"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"5c9b3ad62b","number":"27","text":"Evaluate how a business has used strategies in human resource management to sustain a competitive advantage.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-strategic","hr-str-training","hr-eff-indicators"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"1d075819c2","number":"Question 26","text":"Evaluate how the operations strategies of supply chain management and outsourcing have been successfully used by business in responding to influences on operations.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-supplychain","ops-str-outsourcing"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"6bfa59e219","number":"Question 27","text":"Evaluate the critical role which the factors that influence customer choice play in the successful development of product and promotion marketing strategies.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-psychological","mkt-inf-sociocultural","mkt-inf-economic","mkt-inf-government","mkt-str-product","mkt-str-promotion"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"e67b9538ae","number":"26","text":"Evaluate the importance of operations strategies in achieving the strategic role of operations in a business.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-role-strategic","ops-str-performance","ops-str-quality"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"8ef92a246f","number":"27","text":"How do factors influencing customer choice impact the marketing strategies used by a business in achieving marketing objectives?","marks":20,"verb":"how","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-psychological","mkt-inf-sociocultural","mkt-inf-economic","mkt-inf-government","mkt-proc-objectives","mkt-proc-strategies"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"c47a7306bd","number":"25","text":"Management of Marvels Metals has hired you as a consultant to write a report addressing:\n\u2022 Outline the strategic role of human resources management for this business.\n\u2022 Examine the interdependence between finance and human resources for this business.\n\u2022 Recommend ONE appropriate financial management strategy to address the business' financial problems.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Marvel Metals manufactures metal products for the Australian building industry. Over the past few years, the business has experienced decreasing profitability and cash flow management problems. Rising inflation has affected a range of their costs such as raw materials, utilities and wages. They have also noticed significant delays in receiving payment from their customers. Management is looking to adopt new technology, which will result in job cuts and retraining for some staff. Employees are unhappy with this potential change and it is contributing to increasing rates of absenteeism and staff turnover.","topics":["finance","hr"],"syllabusPoints":["hr-role-strategic","hr-role-interdependence","fin-role-interdependence","fin-str-cashflow","fin-str-profitability"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"95ab288353","number":"25","text":"The directors have asked you to write a business report in which you:\n\u2022 outline some of the challenges including the global factors of costs, skills and supply the business may need to consider in recruiting and retaining staff\n\u2022 compare the use of debt and equity as sources of finance\n\u2022 recommend ONE source of finance this business could use to fund its expansion.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Future Century Gaming Pty Ltd operates an online gaming platform targeting players aged 18\u201340 in Australia. It has been in operation since 2012, providing subscription access to a variety of online games. The business is considering expanding into emerging global markets but is finding it challenging to recruit and retain skilled, qualified game designers and developers in Australia. It is considering international labour markets to overcome staff shortages. The business has decided to finance its expansion into global markets through external sources. Answer is to be presented as a business report.","topics":["hr","finance"],"syllabusPoints":["hr-str-global","hr-proc-acquisition","hr-proc-maintenance","fin-proc-debtequity","fin-inf-debt","fin-inf-equity","fin-proc-matching"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"e0c06b3b40","number":"26","text":"To what extent do influences on marketing affect business success?","marks":20,"verb":"to what extent","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-psychological","mkt-inf-sociocultural","mkt-inf-economic","mkt-inf-government","mkt-inf-consumerlaws","mkt-inf-ethical"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"113ad99af1","number":"27","text":"To what extent do influences on operations affect business success?","marks":20,"verb":"to what extent","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-inf-globalisation","ops-inf-technology","ops-inf-quality","ops-inf-cost","ops-inf-government","ops-inf-legal","ops-inf-envsus","ops-inf-csr"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"1c85f794f0","number":"25","text":"You have been employed as a consultant by Boating and Floating Ltd. to prepare a report that will be given to their management team. In your report, you should:\n\u2022 Describe the advantages of outsourcing the human resource function in a global market for Boating and Floating Ltd.\n\u2022 Explain the importance of a situational analysis for Boating and Floating Ltd. as they plan their international expansion.\n\u2022 Analyse the implementation of global marketing strategies for Boating and Floating Ltd. to effectively launch their products on the global market.","marks":20,"verb":"analyse","type":"extended-response","section":"III","stimulus":"Boating and Floating Ltd. is an Australian manufacturer of boating accessory products that are made from sustainable plastics. The business is planning to launch their products onto the global market, using inputs and materials specific to the local global regions. Boating and Floating Ltd. is considering effective promotional strategies that could be implemented for the successful global launch of their products. In addition, Boating and Floating Ltd. is planning to outsource their human resource function to attain a competitive advantage. Response is to be written in the form of a business report; assessed on knowledge and understanding, applying the hypothetical business situation, and business terminology.","topics":["hr","marketing"],"syllabusPoints":["hr-role-outsourcing","mkt-proc-situational","mkt-str-global"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"e5167a4914","number":"25","text":"You have been employed as a consultant to write a business report to the owners of Natural Life Ltd. In your report:\n\u2022 Outline the relationship between cost and quality in the operations of Natural Life.\n\u2022 Recommend ONE human resource process that could be used to address the current issues of Natural Life.\n\u2022 Evaluate TWO operation strategies Natural Life could adopt to achieve flexibility and dependability performance objectives.","marks":20,"verb":"evaluate","type":"extended-response","section":"III","stimulus":"Business report scenario \u2014 Natural Life: an Australian manufacturer of a range of expensive herbal vitamins and nutritional supplements. The business sources their inputs from local suppliers and undertakes production in their factories throughout Australia. However, Natural Life have received complaints from customers regarding the poor quality of their products and their slow response to customer complaints. Also, there have been media reports concerning the large number of accidents and staff injuries occurring in their factories.","topics":["operations","hr"],"syllabusPoints":["ops-str-performance","ops-str-quality","hr-proc-development","hr-proc-maintenance"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"7873e173d9","number":"Question 25","text":"You have been hired as a consultant by ACB Pty Ltd to write a business report to the owners.\nIn your report:\n\u2022 outline how human resources is interdependent with finance in this business.\n\u2022 explain the limitations of financial reports that this business must be aware of when purchasing the 5 existing American retail sporting stores.\n\u2022 recommend global financial management strategies that could help to reduce financial risks for this business.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Aussie Cricket Bats (ACB) Pty Ltd is an Australian cricket bat manufacturing company hoping to cash in on the newfound popularity of the sport in America by selling cricket bats into that market. ACB plans to sell to Americans via (1) its already well-established Australian website, (2) taking ownership over 5 existing retail sporting stores on the east coast of America, and (3) becoming a supplier of bats to other established American sporting retail chains. To fund these plans ACB needs to borrow the equivalent of $15 million Australian Dollars. The owners are unsure whether to borrow in Australian Dollars from an Australian bank or in US Dollars from an American bank, and are worried about how to staff the 5 American retail stores as well as potentially paying too much for those businesses because they lack accounting expertise.","topics":["hr","finance"],"syllabusPoints":["hr-role-interdependence","fin-proc-limitations","fin-str-global"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"b8646ef9e8","number":"25","text":"You have been hired as a consultant by Delicious Burgers to write a business report for the owners. In your report:\n- describe the influence of quality expectations as part of its operations function that Delicious Burgers must consider as it expands into new markets.\n- discuss the use of holding stock as part of their inventory management in each location.\n- assess the human resource management strategies of recruitment and performance management to help achieve its forecasted growth objectives.","marks":20,"verb":"assess","type":"extended-response","section":"III","stimulus":"Delicious Burgers is a successful Australian high-quality fast-food business which started in 2010 in Manly, Sydney and now operates in more than 30 locations in NSW and Queensland, employing 250 staff. It offers burgers and associated meals including desserts. Restaurants are fitted out so customers feel they are in a beach shack with a relaxed atmosphere. Key to its success has been experienced staff such as knowledgeable chefs and wait staff with excellent customer service skills; staff turnover is very low at 3% (industry average 20%). Delicious Burgers has always sourced the freshest ingredients available and every burger is made to order. The business is expanding to new locations in Western Australia and must hire 50 staff. It has forecast a revenue growth rate of 40% for the next financial year. Management is considering: quality expectations of its goods and service offering; whether to hold inventory in each location; and human resource strategies, specifically recruitment and performance management.","topics":["operations","hr"],"syllabusPoints":["ops-inf-quality","ops-str-inventory","hr-str-recruitment","hr-str-performance"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"d3b055a47d","number":"25","text":"You have been hired as a consultant to write a report for Fly Well Airlines Ltd.\nIn your report:\n\u25aa Outline ONE advantage and ONE disadvantage of outsourcing aircraft servicing and maintenance.\n\u25aa Discuss issues involved in raising funds through both debt and equity finance and make a recommendation to management about which source of funding to use.\n\u25aa Explain TWO human resource strategies that could assist Fly Well Airlines Ltd to address management concerns and help achieve business success.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Fly Well Airlines Ltd is a low-cost Australian based domestic airline that has been exploring options to expand globally. Its domestic customers in Australia typically tend to be business executives and budget conscious leisure travellers. The business intends to begin operating flights into the highly competitive Asian market in the latter part of 2023. To achieve this, the business will have to fund the purchase of new computerised ticketing and baggage facilities at its Sydney terminal. Management believes there is also opportunity for the airline to move all scheduled aircraft servicing and maintenance to a contractor in Singapore. Employees who belong to unions have indicated they will respond to this with industrial action. Management is also concerned about the best way to achieve a sustainable competitive advantage in their new overseas markets.","topics":["operations","finance","hr"],"syllabusPoints":["ops-str-outsourcing","fin-proc-debtequity","hr-str-disputes","hr-str-training"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"f259726aeb","number":"26","text":"Explain the importance to a business of having human resources strategies that reduce workplace disputes and increase worker satisfaction.","marks":20,"verb":"explain","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-disputes","hr-eff-indicators","hr-str-rewards"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"f63c83b750","number":"27","text":"Explain the importance to a business of having operations processes that can maintain a competitive advantage.","marks":20,"verb":"explain","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-role-strategic","ops-proc-fourvs","ops-proc-tasklayout","ops-proc-monitoring"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"26bce53600","number":"25","text":"You have been hired as a consultant by Bee Sticky Pty Ltd to write a business report for the owners. In your report:\n\u2022 describe branding and product strategies the business could use to expand into global markets\n\u2022 recommend a channel choice that would suit this business's expansion\n\u2022 analyse the global financial management strategies required for a successful expansion.","marks":20,"verb":"analyse","type":"extended-response","section":"III","stimulus":"Bee Sticky Pty Ltd is an established Australian manufacturing business that produces a wide range of high quality and premium organic honey. It is expanding into global markets and will lease warehouses in Malaysia and the USA. A recently completed SWOT analysis is provided. Strengths: high quality, premium and organic honey products; approved for consumption and medical uses; made by honeybees from Australian flora. Weaknesses: frequent breakage of product during transportation; lack of experience in foreign payment systems. Opportunities: expanding market for high quality honey in countries overseas; falling bee populations overseas; potential collaborations with up-market restaurants/chefs. Threats: established competition in foreign markets; fluctuations in the Australian dollar.","topics":["marketing","finance"],"syllabusPoints":["mkt-str-product","mkt-str-global","mkt-str-place","fin-str-global"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"cf1fe574d6","number":"26","text":"Analyse how a situational analysis (SWOT, product life cycle) may affect marketing strategies.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-proc-situational","mkt-proc-strategies"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"4c2490a616","number":"27","text":"Analyse how human resource management strategies can improve the process of employee acquisition and maintenance.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-proc-acquisition","hr-proc-maintenance","hr-str-recruitment","hr-str-rewards"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"258b714717","number":"25","text":"You have been hired as a consultant by Ozzi Baby Food Pty Ltd to write a business report to the owners. In your report:\n- outline TWO operations influences affecting this business\n- discuss the use of retraining and redundancy payments to help overcome employee resistance to these changes\n- compare the use of a mortgage to a new issue of shares to fund the factory purchase.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Hypothetical business: Ozzi Baby Food Pty Ltd has a trusted reputation in domestic and global markets due to its safe and sustainably-sourced product range, which has led to a significant increase in demand. It is considering purchasing a larger automated factory, which will lead to some job losses. External finance is required to fund the purchase, using either a mortgage or becoming a public company on the Australian Securities Exchange (ASX). The response must be presented as a business report.","topics":["operations","hr","finance"],"syllabusPoints":["ops-inf-technology","ops-inf-globalisation","ops-inf-envsus","ops-str-change","hr-str-training","hr-proc-separation","fin-inf-debt","fin-inf-equity","fin-proc-debtequity"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"57ae697542","number":"27","text":"Evaluate human resource strategies used to achieve THREE indicators of effective human resource management.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators","hr-str-training","hr-str-rewards","hr-str-performance","hr-str-disputes"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"53de643207","number":"26","text":"Evaluate the effectiveness of financial management strategies used to achieve profit and growth objectives.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-str-cashflow","fin-str-workingcapital","fin-str-profitability"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"37b87f7902","number":"25","text":"Icecreams R Us exclusively delivers ice-cream to homes in Newcastle. To increase market share, they are negotiating with a major service station chain, Eucafuels Ltd, to sell their brand of ice-cream throughout NSW.\nBefore they agree to sell the ice-cream, Eucafuels Ltd have a number of concerns over the ability of Icecreams R Us to:\n\u2022 deliver ice-cream to their outlets in NSW in a timely manner\n\u2022 create an awareness that the ice-cream will be sold at Eucafuels Ltd outlets\n\u2022 produce an increased volume of ice-cream while maintaining a quality product.\nTo address these concerns, you have been hired as a consultant by Icecreams R Us to write a report to their directors. In your report:\n\u2022 describe TWO physical distribution issues that the business needs to consider in the delivery of their product\n\u2022 justify ONE promotional strategy the business could use\n\u2022 recommend possible changes the business could make to their operations processes to address the volume and quality concerns of Eucafuels Ltd.","marks":20,"verb":"recommend","type":"extended-response","section":"III","stimulus":"Hypothetical business: Icecreams R Us, which currently delivers ice-cream only to homes in Newcastle. To increase market share it is negotiating with a major NSW service station chain, Eucafuels Ltd, to stock its ice-cream statewide. Eucafuels Ltd is concerned about Icecreams R Us's ability to deliver to NSW outlets in a timely manner, to create awareness that the ice-cream is sold at Eucafuels outlets, and to produce increased volume while maintaining quality. The response must take the form of a consultant's business report to the directors.","topics":["marketing","operations"],"syllabusPoints":["mkt-str-place","mkt-str-promotion","ops-proc-fourvs","ops-proc-monitoring"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"19cd648768","number":"26","text":"Analyse the relationship between market segmentation and marketing strategies.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-segmentation","mkt-proc-target","mkt-proc-strategies"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"c2fe0e2523","number":"25","text":"You have been hired as a consultant to write a report for the owners. In your report:\n\u2022 discuss methods this business could use in the acquisition and development of staff\n\u2022 recommend TWO appropriate working capital management strategies for this business.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Business report scenario: Roo's Outback Eatery Pty Ltd is opening an additional restaurant in NSW. They plan to position the restaurant as an exclusive restaurant specialising in modern Australian food with quality customer service. The owners require assistance with the following: the acquisition and development of suitable staff; additional funds for the day-to-day running of the business; the close monitoring of working capital. The response must be written in the form of a business report applying the hypothetical business situation.","topics":["hr","finance"],"syllabusPoints":["hr-proc-acquisition","hr-proc-development","hr-str-recruitment","hr-str-training","fin-str-workingcapital"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"a981e0cfaa","number":"Question 27","text":"Analyse the relationship between performance objectives and operations strategies.","marks":20,"verb":"analyse","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance","ops-str-quality","ops-str-supplychain"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS","2019 HSC Business Studies"],"kind":"Question bank","year":null},{"id":"e850807eb2","number":"Question 27","text":"Assess why ethical behaviour and government regulation are important in marketing management.","marks":20,"verb":"assess","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-ethical","mkt-inf-consumerlaws"],"sources":["HSC Final Exam Preparation \u2014 MARKETING"],"kind":"Question bank","year":null},{"id":"261bbe8609","number":"Question 26","text":"Evaluate price and promotional strategies management could implement to achieve business success.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-price","mkt-str-promotion"],"sources":["HSC Final Exam Preparation \u2014 MARKETING"],"kind":"Question bank","year":null},{"id":"f68a2b4627","number":"Question 27","text":"Evaluate the response of operations management to external influences.","marks":20,"verb":"evaluate","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-inf-globalisation","ops-inf-technology","ops-inf-cost"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"1911c66334","number":"Question 26","text":"Explain how legal regulations and corporate social responsibility impact on a business' operations management.","marks":20,"verb":"explain","type":"extended-response","section":"IV","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-inf-legal","ops-inf-csr"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"012b2b871e","number":"Question","text":"You have been employed as a consultant to prepare a report for the management. In your report:\n\u2022 Describe ONE factor which could influence customer choice.\n\u2022 Explain the marketing process of market research.\n\u2022 Evaluate ONE price strategy and ONE promotional strategy the management could use to market its new running shoes.","marks":20,"verb":"evaluate","type":"extended-response","section":"III","stimulus":"Business report scenario \u2014 Green Streak Ltd (GSL): a new manufacturer and retailer of high-quality running shoes for athletes. The business has a factory located in the suburbs which manufactures its product and is aiming to sell its running shoes across Australia. It is considering expanding its online presence, which would enable consumers to buy their shoes online via the company's website. The management of Green Streak Ltd (GSL) are unsure about: the factors which could influence customer choice; how to conduct market research; and what are the most effective pricing and promotional strategies to market its new running shoes.","topics":["marketing"],"syllabusPoints":["mkt-inf-psychological","mkt-inf-sociocultural","mkt-inf-economic","mkt-proc-research","mkt-str-price","mkt-str-promotion"],"sources":["HSC Final Exam Preparation \u2014 MARKETING"],"kind":"Question bank","year":null},{"id":"62aed564b2","number":"Question 25","text":"You have been employed as a consultant to prepare a report for the management of Fast Car Parts Ltd. In your report:\n\u2022 Outline TWO National Employment Standards the Human Resource manager should be aware of while negotiating the new enterprise agreement.\n\u2022 Describe ONE influence on operations at Fast Car Parts Ltd.\n\u2022 Discuss TWO appropriate operations strategies management could implement at Fast Car Parts Ltd.\n\u2022 Recommend ONE profitability strategy the business could use to help increase sales or reduce expenses.","marks":20,"verb":"discuss","type":"extended-response","section":"III","stimulus":"Fast Car Parts Ltd is a successful producer of car parts with a number of factories throughout NSW. It is experiencing difficulties with its operations due to the rapidly changing nature of global markets and increased competition. This has led to declining sales and increasing expenses. The Human Resource manager is currently negotiating a new enterprise agreement with staff. Management are unsure about the various strategies they need to implement to solve the issues the company faces.","topics":["operations","hr","finance"],"syllabusPoints":["hr-inf-legal-framework","ops-inf-globalisation","ops-str-supplychain","ops-str-technology","fin-str-profitability"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"da03c854af","number":"22 (b)","text":"Analyse THREE steps in the marketing process required to develop a new marketing plan for this business.","marks":6,"verb":"analyse","type":"short-answer","section":"II","stimulus":"Spook is an exclusive luxury fashion retailer with a target market of high-income customers. Recently they have experienced a decrease in sales and profits due to an economic downturn. The business has decided to review their marketing plan in response to this change.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational","mkt-proc-research","mkt-proc-strategies"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"f21831fe71","number":"23 (c)","text":"Discuss THREE different global marketing strategies that this company needs to consider if they decide to aggressively expand overseas.","marks":6,"verb":"discuss","type":"short-answer","section":"II","stimulus":"EZ Sleep Ltd is an Australian company that has recently launched a new leading-edge electric blanket for $4,000 \u2014 a price 10 times higher than any other electric blanket on the market. The blanket connects to a mobile phone app which monitors heart rate and sleep quality and adjusts bed temperature to the user's preferences. Australian celebrities have been posting about the product on social media and EZ Sleep's website has been flooded with orders.","topics":["marketing"],"syllabusPoints":["mkt-str-global"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"4e7f9a89ff","number":"23 (b)","text":"Justify the use of rewards and leadership style as strategies to improve the effectiveness of human resource management for this business.","marks":6,"verb":"justify","type":"short-answer","section":"II","stimulus":"HiFashion is a fast fashion retail store with 40 stores around Australia employing 200 staff. Management is concerned about a reduction in productivity and staff feedback; staff cited rewards, leadership style and dispute resolution methods as key to their dissatisfaction. Data extract: staff turnover 10% (2021) to 20% (2022); employee satisfaction 80% (2021) to 65% (2022); number of disputes 10 per year (2021) to 25 per year (2022).","topics":["hr"],"syllabusPoints":["hr-str-rewards","hr-str-leadership","hr-eff-indicators"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"de37f01779","number":"23 (c)","text":"In recent times governments have imposed restrictions on businesses such as lockdowns, social distancing and the movement of people. As a result, businesses have changed the way their employees work and communicate with each other.\nDiscuss the possible implications of these influences on human resource management.","marks":6,"verb":"discuss","type":"short-answer","section":"II","stimulus":"Scenario: governments have recently imposed restrictions on businesses such as lockdowns, social distancing and limits on the movement of people, and as a result businesses have changed the way their employees work and communicate with each other.","topics":["hr"],"syllabusPoints":["hr-inf-social","hr-inf-technological","hr-inf-stakeholders"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"f06d3cae6d","number":"23 (b)","text":"Analyse operations strategies that could be used to address TWO operations influences affecting this business.","marks":6,"verb":"analyse","type":"short-answer","section":"II","stimulus":"A denim jeans clothing store is concerned about declining sales. It has identified that the lower sales are a result of: outdated store presentation; increased foreign competition; and a reluctance to adopt modern in-store payment methods.","topics":["operations"],"syllabusPoints":["ops-inf-technology","ops-inf-globalisation","ops-str-technology"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"7343afd063","number":"Question 21 (c)","text":"Explain how globalisation and legal regulations might influence the operations strategies used by Super Trunks.","marks":6,"verb":"explain","type":"short-answer","section":"II","stimulus":"Super Trunks is a well-known underwear brand currently manufactured in South Sydney. The brand is becoming more recognised and demand for its products has increased dramatically. It has recently been contacted by overseas stores and consumers interested in buying its underwear.","topics":["operations"],"syllabusPoints":["ops-inf-globalisation","ops-inf-legal"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"cfe4fe0e4c","number":"22 (c)","text":"Analyse the implementation of technology in achieving operations objectives for this business.","marks":5,"verb":"analyse","type":"short-answer","section":"II","stimulus":"Focus Frames produces eyewear such as sunglasses and prescription glasses using an automated assembly line that is run by a combination of staff and robotics. They are seeking to improve the speed and efficiency of their manufacturing process.","topics":["operations"],"syllabusPoints":["ops-str-technology","ops-str-performance"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"515d9278ca","number":"21 (c)","text":"Assess the importance of market segmentation in the development of effective marketing strategies for this business.","marks":5,"verb":"assess","type":"short-answer","section":"II","stimulus":"Exquisite Gardens Pty Ltd, located in Bowral NSW, provides upmarket plants and garden furniture for consumers residing in country estates. Their customers are primarily professionals of high socioeconomic status who love gardening. The business is currently planning to expand its market throughout Australia, however management is concerned about the potential impact of a decline in Australia's current economic growth and an increase in government regulations on the business.","topics":["marketing"],"syllabusPoints":["mkt-str-segmentation","mkt-proc-target"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"9dcca125d9","number":"23 (c)","text":"Assess the influence of corporate social responsibility on operations management for Precision Shave.","marks":5,"verb":"assess","type":"short-answer","section":"II","stimulus":"Precision Shave produces and sells a collection of eco-friendly razors made from sustainable materials. The business is also introducing a subscription service that delivers customised shaving kits catering to the specific needs of individual consumers.","topics":["operations"],"syllabusPoints":["ops-inf-csr","ops-inf-envsus"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"b2a7751a1c","number":"22 (c)","text":"Coffee Mania wants to expand its business and is looking at different financing options.\nJustify ONE source of finance to fund Coffee Mania's expansion.","marks":5,"verb":"justify","type":"short-answer","section":"II","stimulus":"Coffee Mania, a local cafe. Latest financial statement key figures: Current Assets $200,000; Non-Current Assets $800,000; Current Liabilities $150,000; Non-Current Liabilities $500,000; Owner's Equity $350,000. (Debt to equity is therefore 1.87:1.) The business wants to fund an expansion.","topics":["finance"],"syllabusPoints":["fin-inf-debt","fin-inf-equity","fin-proc-debtequity"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"0df032a8e7","number":"21 (c)","text":"Demonstrate the interdependence between operations and marketing for this business.","marks":5,"verb":"demonstrate","type":"short-answer","section":"II","stimulus":"FashionForward is an Australian luxury clothing retailer with retail stores in each state and an online shop. It wants to expand retail stores globally using its current overseas suppliers in China, France and Italy. Recent media reports state that Australians throw away an average of 23 kilograms of clothing to landfill each year. As a result, FashionForward is facing challenges related to environmental sustainability.","topics":["operations","marketing"],"syllabusPoints":["ops-role-interdependence","mkt-role-interdependence"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"f432988463","number":"22 (c)","text":"Describe how changes in technology impact on Human Resources processes.","marks":5,"verb":"describe","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-technological","hr-proc-development"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"555215259a","number":"23 (c)","text":"Discuss TWO suitable channel choices for this business for the new products.","marks":5,"verb":"discuss","type":"short-answer","section":"II","stimulus":"A business manufactures loungewear and is known for distinctive patterns and comfort. Management is introducing a new premium product range of athletic wear. Economic conditions have worsened and unemployment has risen.","topics":["marketing"],"syllabusPoints":["mkt-str-place"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"cc990f2fa2","number":"21 (c)","text":"Analyse the use of sale and leaseback as a financial management strategy for this business.","marks":5,"verb":"analyse","type":"short-answer","section":"II","stimulus":"Financial information for Playsmart Child Care Ltd (balance sheet extract). Current Assets: Cash $40 000; Accounts Receivable $100 000; Inventory $100 000. Non-Current Assets: Building $320 000; Delivery van $40 000; Goodwill $100 000. Current Liabilities: Accounts Payable $100 000; Bank overdraft $130 000. Non-Current Liabilities: Mortgage $300 000. Owners' Equity: Capital $150 000; Retained Profit $20 000. Additional information: Debt to equity ratio = Total Liabilities / Total Equity; gearing industry average 2:1.","topics":["finance"],"syllabusPoints":["fin-str-workingcapital"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"625c574d5b","number":"21 (c)","text":"Discuss the strategy of internal recruitment for Raj.","marks":5,"verb":"discuss","type":"short-answer","section":"II","stimulus":"Raj owns a business that designs security software. His business is rapidly expanding due to the increase in companies allowing their employees to work from home. Raj needs to increase his workforce to keep up with his demand. The work is complicated and requires excellent knowledge of coding and software design. Due to the expansion, Raj requires more employees in management roles.","topics":["hr"],"syllabusPoints":["hr-str-recruitment","hr-proc-acquisition"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"0582d6e65c","number":"24 (c)","text":"Evaluate the effectiveness of human resources management at this business.","marks":5,"verb":"evaluate","type":"short-answer","section":"II","stimulus":"Table of data for a business between 2022 and 2023: Absenteeism per employee 10 days (2022) rising to 15 days (2023); Staff turnover 15% rising to 18%; Training expenditure per employee $2 100 rising to $3 400; Accidents per 100 employees falling from 11 to 5.","topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Barker Trial 2023","Barker Trial 2024"],"kind":"Barker Trial","year":2023},{"id":"66f7b792cc","number":"24 (c)","text":"Explain TWO limitations of financial reports.","marks":5,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-proc-limitations"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"23b510183e","number":"23 (d)","text":"Explain how determining the target market of Sophie's Glamping Resort would assist the business to develop appropriate marketing strategies.","marks":5,"verb":"explain","type":"short-answer","section":"II","stimulus":"Sophie's Glamping Resort, located in Northern Queensland, provides an upmarket camping experience of outstanding service and facilities for consumers of high socioeconomic status.","topics":["marketing"],"syllabusPoints":["mkt-proc-target","mkt-proc-strategies"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"374daa72d5","number":"23 (c)","text":"Justify ONE global marketing strategy this cereal manufacturer could use to expand into the global market.","marks":5,"verb":"justify","type":"short-answer","section":"II","stimulus":"A cereal manufacturer has decided to change the packaging of its product in an attempt to reverse a drop in sales and remain competitive with existing businesses. It is also considering growing its target market by catering for health-conscious consumers in Australia and eventually expanding into the global market.","topics":["marketing"],"syllabusPoints":["mkt-str-global"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"56fce8d2a2","number":"22 (c)","text":"Recommend TWO global factors that HiTel should implement to meet cost and speed performance objectives.","marks":5,"verb":"recommend","type":"short-answer","section":"II","stimulus":"HiTel is a leading Australian electronics company expanding rapidly in the Asia Pacific region. It is moving its Sydney-based manufacturing to India. The cost of the change is forecast at $40 million, it will take six months to implement, and 250 staff will be impacted.","topics":["operations"],"syllabusPoints":["ops-str-global","ops-str-performance"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"ce198e6c25","number":"21 (c)","text":"The owners of the tyre manufacturing business have purchased leading-edge technology to help achieve economies of scale.\nExplain why both staff and management might be resistant to this change.","marks":5,"verb":"explain","type":"short-answer","section":"II","stimulus":"An Australian tyre manufacturer is expanding its business, sourcing rubber from the global market to reduce operating costs and increase sales and profit, while wanting to maintain quality outputs and achieve economies of scale. The owners have purchased leading-edge technology to help achieve economies of scale.","topics":["operations"],"syllabusPoints":["ops-str-change","ops-str-technology"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"8c706bfb24","number":"22 (c)","text":"The table shows labour force participation rates for males and females in Australia, 1981\u20132021.\nExplain the social influences th
