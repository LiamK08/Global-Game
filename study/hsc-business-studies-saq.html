answer","section":"II","stimulus":"Food Plus Pty Ltd is a health food grocery store, operating successfully in NSW for the last 10 years. Management is now aiming to expand overseas by opening three stores in the USA in the next two years. There are a number of global market influences which Food Plus Pty Ltd needs to consider in relation to this global expansion.","topics":["finance"],"syllabusPoints":["fin-role-objectives"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"c0321af346","number":"23 (a)","text":"Outline the approach to marketing that this commercial has adopted.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"A television commercial for a hair dryer on a shopping channel indicates that if customers order the hair dryer in the next ten minutes, they will also receive a free set of knives at no extra cost. The narrator of this commercial tells viewers that these knives can cut through anything with a single slice.","topics":["marketing"],"syllabusPoints":["mkt-role-approaches"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"e7c70ebf0c","number":"22 (a)","text":"Outline the impact of work health and safety legislation on Australian businesses.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-whs"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"2e49999e16","number":"24 (a)","text":"Outline the purpose of the Fair Work Act.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"TechWorld is reviewing its human resources strategies to ensure alignment with its goals for: growth; innovation; supportive work culture; current legal framework.","topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"34d4151653","number":"22 (a)","text":"Outline the role of ONE external stakeholder who represents the interests of employees in business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"The retail business, Spend More, has been rapidly expanding in the past 2 years and requires additional staff and premises. However, the increasing changes have led to conflict and uncertainty between management and employees in the workplace.","topics":["hr"],"syllabusPoints":["hr-inf-stakeholders"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"a1183f4e75","number":"21 (a)","text":"Outline the role of operations in supporting FashionForward's international expansion.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"FashionForward is an Australian luxury clothing retailer with retail stores in each state and an online shop. It wants to expand retail stores globally using its current overseas suppliers in China, France and Italy. Recent media reports state that Australians throw away an average of 23 kilograms of clothing to landfill each year. As a result, FashionForward is facing challenges related to environmental sustainability.","topics":["operations"],"syllabusPoints":["ops-role-strategic"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"e156087b64","number":"21 (a)","text":"Outline the strategic role of marketing for this business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Healthy Pies and Burgers Pty Ltd is a fast-food chain that has been operating successfully in Australia for over 10 years. Management has decided to expand its operations overseas and access global markets using a customised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-role-strategic"],"sources":["Independent Trial 2024","Newington Trial 2023","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"e5cbfe1dfb","number":"23 (a)","text":"Outline the strategic role of marketing.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Question 23 scenario: a business manufactures loungewear and is known for distinctive patterns and comfort. Management is introducing a new premium product range of athletic wear. Economic conditions have worsened and unemployment has risen.","topics":["marketing"],"syllabusPoints":["mkt-role-strategic"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"c6e919bcba","number":"22 (a)","text":"Recommend an inventory management system that can be used by this business to better manage stock.","marks":2,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Style Furniture Pty Ltd is an Australian business that manufactures and sells furniture in Sydney. The business is holding excess stock which is difficult to sell. Management is attempting to improve its furniture production and reduce the cost of its operations processes. It is also investigating if outsourcing its operations processes to an overseas manufacturer or investing in technology will assist it in achieving its goals.","topics":["operations"],"syllabusPoints":["ops-str-inventory"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"91df56d986","number":"22 (a)","text":"Calculate and comment on the Return on Owner's Equity for Local Grocer Pty Ltd. Round off your calculation to 1 decimal point.","marks":2,"verb":"calculate","type":"short-answer","section":"II","stimulus":"Balance Sheet for Local Grocer Pty Ltd, June 2023.\nCurrent Assets: Cash $25 000; Accounts Receivable $45 000; Inventory $55 000.\nNon-Current Assets: Building $400 000; Delivery van $50 000.\nCurrent Liabilities: Accounts Payable $35 000; Bank overdraft $65 000.\nNon-Current Liabilities: Mortgage $225 000.\nOwners' Equity: Capital $200 000; Retained Profit $50 000.\nAdditional financial information: Return on Owners' Equity ratio for 2022 = 0.1:1.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"45cd8a7be3","number":"22 (a)","text":"Calculate and interpret the change in the return on equity (net profit \u00f7 total equity) for this business between 2022 and 2023.","marks":2,"verb":"calculate","type":"short-answer","section":"II","stimulus":"Balance Sheet for Simon's Sporting Goods Pty Ltd (a large sporting goods retailer), as at 30 June 2023, figures in '000s. ASSETS: Cash at bank 800; Inventories 300; Accounts receivable 800 (current assets 1900); Plant & Equipment 500; Motor Vehicles 1200; Land & Buildings 4000 (non-current assets 5700); Total assets 7600. LIABILITIES: Accounts payable 1000; Overdraft 300 (current liabilities 1300); Two-year bank loan 1500; Mortgage 3000 (non-current liabilities 4500). OWNER'S EQUITY: Capital 1000; Retained Profit 800 (total equity 1800). Other information: Net profit for 2023 = $300 000; Return on Equity (net profit \u00f7 total equity) for 2022 = 20%. Industry Averages: Debt to Equity (total liabilities \u00f7 total equity) = 2:1; Current Ratio (current assets \u00f7 current liabilities) = 1:1.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"40fe82771e","number":"21 (b)","text":"Calculate the current ratio (current assets \u00f7 current liabilities) for Bakers Dozen and comment on their liquidity.","marks":2,"verb":"calculate","type":"short-answer","section":"II","stimulus":"Balance sheet for Bakers Dozen Pty. Ltd. as at 30 June 2023. Current Assets: Cash $19 000, Debtors $2 500, Stock $34 000 (total current assets $55 500). Non-current Assets: Equipment $62 000, Buildings $318 000, Land $160 000. Total Assets $595 500. Current Liabilities: Overdraft $30 000. Non-current Liabilities: Debentures $94 000, Mortgage $291 500. Owner's Equity: Capital $95 000, Retained profit $85 000 (total equity $180 000). Total Liabilities + Equity $595 500. Other information: Net profit for 2022-2023 was $160 000; industry average for liquidity is 2.5:1; industry gearing (total liabilities \u00f7 owner's equity) is 1:1.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"1dfd6b2b05","number":"24 (a)","text":"Define corporate culture.","marks":2,"verb":"define","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"9fa44de8a3","number":"22 (a)","text":"Define retained profits.","marks":2,"verb":"define","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-inf-internal"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"b9d58a1faa","number":"24 (b)","text":"Describe ONE benefit that might result from deciding to outsource an aspect of human resource management.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-outsourcing"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"ef544293da","number":"21 (b)","text":"Describe ONE disadvantage of holding stock for the car retailer.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"A car retailer expects high demand and orders extra stock of the latest release lower priced, electric car. The car retailer also provides longer warranties than competitors as well as car repairs and services.","topics":["operations"],"syllabusPoints":["ops-str-inventory"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"a8772e00d3","number":"23 (c)","text":"Describe ONE ethical influence of marketing, of which this business should be aware.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"Sophie's Glamping Resort, located in Northern Queensland, provides an upmarket camping experience of outstanding service and facilities for consumers of high socioeconomic status.","topics":["marketing"],"syllabusPoints":["mkt-inf-ethical"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"e810827d51","number":"21 (d)","text":"Describe how Australian Securities and Investment Commission impacts this business.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"Bakers Dozen Pty. Ltd. Over the past two years the business has experienced remarkable success, with consistently strong profits and a devoted customer base. Fuelled by this growth, the owners' intentions are to expand nationally. Bakers Dozen's expansion aims to reach a wider audience while maintaining the same high-quality and personalised touch that secured such early success within their local community.","topics":["finance"],"syllabusPoints":["fin-inf-government"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"4f692d4d79","number":"23 (a)","text":"Describe how EZ Sleep could collect primary market research data on this product.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"EZ Sleep Ltd is an Australian company that has recently launched a new leading-edge electric blanket for $4,000 \u2014 a price 10 times higher than any other electric blanket on the market. The blanket connects to a mobile phone app which monitors heart rate and sleep quality and adjusts bed temperature to the user's preferences. Australian celebrities have been posting about the product on social media and EZ Sleep's website has been flooded with orders.","topics":["marketing"],"syllabusPoints":["mkt-proc-research"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"c39d1f124b","number":"24 (b)","text":"Describe the importance of physical evidence to ZZ's function centre.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"ZZ's operates a function centre for large birthday parties for residents in the local area. ZZ's has renovated and expanded their function centre so that they can provide additional functions such as school formals and weddings.","topics":["marketing"],"syllabusPoints":["mkt-str-ppp"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"a646c8bca5","number":"22 (b)","text":"Describe the purpose of comparative ratio analysis for a business.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-proc-comparative"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"d02bb4882f","number":"21 (b)","text":"Describe the strategic role of operations adopted by this business.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"Make Ur Own Ice Cream Pty Ltd is a premium self-serve ice cream shop where customers can grab whatever lollies and chocolates they want and add them into their ice creams. They only stock high-quality ingredients. The company weighs the product and charges a price based on how heavy it is.","topics":["operations"],"syllabusPoints":["ops-role-strategic"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"95f76a75b3","number":"22 (c)","text":"Explain ONE advantage of Local Grocer Pty Ltd using debt finance rather than equity finance.","marks":2,"verb":"explain","type":"short-answer","section":"II","stimulus":"Balance Sheet for Local Grocer Pty Ltd, June 2023.\nCurrent Assets: Cash $25 000; Accounts Receivable $45 000; Inventory $55 000.\nNon-Current Assets: Building $400 000; Delivery van $50 000.\nCurrent Liabilities: Accounts Payable $35 000; Bank overdraft $65 000.\nNon-Current Liabilities: Mortgage $225 000.\nOwners' Equity: Capital $200 000; Retained Profit $50 000.\nAdditional financial information: Return on Owners' Equity ratio for 2022 = 0.1:1.","topics":["finance"],"syllabusPoints":["fin-proc-debtequity"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"a7fec2025d","number":"21 (b)","text":"How does the volume of output influence the operations process?","marks":2,"verb":"how","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-proc-fourvs"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"9be8f4a092","number":"21 (a)","text":"Identify TWO ways that leadership style can affect employee performance in a business.","marks":2,"verb":"identify","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-leadership"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"adb9286965","number":"23 (a)","text":"Outline ONE indicator that can be used to measure the effectiveness of human resource management in a business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"fd50339109","number":"21 (a)","text":"Outline ONE limitation of this financial report.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Financial information for Playsmart Child Care Ltd (balance sheet extract). Current Assets: Cash $40 000; Accounts Receivable $100 000; Inventory $100 000. Non-Current Assets: Building $320 000; Delivery van $40 000; Goodwill $100 000. Current Liabilities: Accounts Payable $100 000; Bank overdraft $130 000. Non-Current Liabilities: Mortgage $300 000. Owners' Equity: Capital $150 000; Retained Profit $20 000. Additional information: Debt to equity ratio = Total Liabilities / Total Equity; gearing industry average 2:1.","topics":["finance"],"syllabusPoints":["fin-proc-limitations"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"8fb690f984","number":"24 (a)","text":"Outline ONE possible target market for ZZ's function centre.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"ZZ's operates a function centre for large birthday parties for residents in the local area. ZZ's has renovated and expanded their function centre so that they can provide additional functions such as school formals and weddings.","topics":["marketing"],"syllabusPoints":["mkt-proc-target"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"c98ad39858","number":"21 (a)","text":"Outline ONE potential issue this business could face in relation to both cost and quality of outputs.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"An Australian tyre manufacturer is expanding its business. In order to reduce operating costs and increase sales and profit, rubber will be sourced from the global market. The business wants to: maintain quality outputs; achieve economies of scale.","topics":["operations"],"syllabusPoints":["ops-str-global","ops-str-quality"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"2d38d85006","number":"21 (a)","text":"Outline ONE strategic role of operations management for the car retailer.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"A car retailer expects high demand and orders extra stock of the latest release lower priced, electric car. The car retailer also provides longer warranties than competitors as well as car repairs and services.","topics":["operations"],"syllabusPoints":["ops-role-strategic"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"34045d2d21","number":"22 (a)","text":"Outline TWO reasons why management might be resistant to this change.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"HiTel is a leading Australian electronics company expanding rapidly in the Asia Pacific region. It is moving its Sydney-based manufacturing to India. The cost of the change is forecast at $40 million, it will take six months to implement, and 250 staff will be impacted.","topics":["operations"],"syllabusPoints":["ops-str-change"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"767fae077f","number":"23 (c)","text":"Outline how quality expectations could impact this business","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Rebecca owns and operates a health food business. Due to an increase in competition from large retail chains, she needs to revise her operational strategies. A problem that her customers have identified is products that are consistently 'out of stock', as well as damaged goods in need of replacing.","topics":["operations"],"syllabusPoints":["ops-inf-quality"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"6a77ebaef5","number":"23 (b)","text":"Outline how sociocultural factors can influence consumer choice for Sophie's Glamping Resort.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Sophie's Glamping Resort, located in Northern Queensland, provides an upmarket camping experience of outstanding service and facilities for consumers of high socioeconomic status.","topics":["marketing"],"syllabusPoints":["mkt-inf-sociocultural"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"1d037b20ff","number":"23 (a)","text":"Outline the current product life cycle stage of this cereal.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"A cereal manufacturer has decided to change the packaging of its product in an attempt to reverse a drop in sales and remain competitive with existing businesses. It is also considering growing its target market by catering for health-conscious consumers in Australia and eventually expanding into the global market.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"6222785c6c","number":"21 (c)","text":"Outline the purpose of task design.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-proc-tasklayout"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"8dacac4acc","number":"24 (a)","text":"Outline the strategic role of human resource management.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-strategic"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"c48833fcd2","number":"24 (a)","text":"Outline the strategic role of the human resource function.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-strategic"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"bdee3fef1d","number":"21 (a)","text":"Outline why the customer themselves would be considered as a transformed resource in this business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Make Ur Own Ice Cream Pty Ltd is a premium self-serve ice cream shop where customers can grab whatever lollies and chocolates they want and add them into their ice creams. They only stock high-quality ingredients. The company weighs the product and charges a price based on how heavy it is.","topics":["operations"],"syllabusPoints":["ops-proc-inputs"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"7ab9669c0f","number":"24 (a)","text":"Recommend ONE appropriate pricing method that QuadTel should use in Australia.","marks":2,"verb":"recommend","type":"short-answer","section":"II","stimulus":"QuadTel is a US based business that sells innovative high quality drone technology to consumers. It is considering entering the Australian market and is currently reviewing the best way to market their products.","topics":["marketing"],"syllabusPoints":["mkt-str-price"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"32c2ca693f","number":"22 (b)","text":"Recommend ONE working capital management strategy Local Grocer Pty Ltd. could use to improve its liquidity.","marks":2,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Balance Sheet for Local Grocer Pty Ltd, June 2023.\nCurrent Assets: Cash $25 000; Accounts Receivable $45 000; Inventory $55 000.\nNon-Current Assets: Building $400 000; Delivery van $50 000.\nCurrent Liabilities: Accounts Payable $35 000; Bank overdraft $65 000.\nNon-Current Liabilities: Mortgage $225 000.\nOwners' Equity: Capital $200 000; Retained Profit $50 000.\nAdditional financial information: Return on Owners' Equity ratio for 2022 = 0.1:1.","topics":["finance"],"syllabusPoints":["fin-str-workingcapital"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"b1e9d641fb","number":"21 (c)","text":"Recommend a cash flow management strategy to improve Bakers Dozen's liquidity.","marks":2,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Balance sheet for Bakers Dozen Pty. Ltd. as at 30 June 2023. Current Assets: Cash $19 000, Debtors $2 500, Stock $34 000 (total current assets $55 500). Current Liabilities: Overdraft $30 000. Non-current Liabilities: Debentures $94 000, Mortgage $291 500. Owner's Equity: Capital $95 000, Retained profit $85 000. Total Assets $595 500. Net profit for 2022-2023 was $160 000; industry average for liquidity is 2.5:1; industry gearing is 1:1. The business's current ratio is well below the industry average.","topics":["finance"],"syllabusPoints":["fin-str-cashflow"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"0cc59a3488","number":"21 (a)","text":"Using an example, distinguish between transformed and transforming resources.","marks":2,"verb":"distinguish","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-proc-inputs"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"64f3db0bfb","number":"22 (a)","text":"What is the purpose of Equal Employment Opportunity (EEO) legislation?","marks":2,"verb":"what","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-discrimination"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"d84acf9ff8","number":"24 (a)","text":"What is the purpose of a cash flow statement?","marks":2,"verb":"what","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-proc-statements"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"ae3330f270","number":"23 (c)","text":"Why is efficiency a financial objective?","marks":2,"verb":"why","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"dfa5b19ad0","number":"21 (c)","text":"Why may this business exceed its legal obligations when offering warranties to customers?","marks":2,"verb":"why","type":"short-answer","section":"II","stimulus":"A car retailer expects high demand and orders extra stock of the latest release lower priced, electric car. The car retailer also provides longer warranties than competitors as well as car repairs and services.","topics":["operations"],"syllabusPoints":["ops-inf-csr","ops-proc-outputs"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"89c82cccb2","number":"22 (a)","text":"With reference to this business, distinguish between transformed and transforming resources.","marks":2,"verb":"distinguish","type":"short-answer","section":"II","stimulus":"Tasty Bites Caf\u00e9 is a food-based business that aims to revitalise its competitive edge by expanding its menu to include a wider range of culinary offerings. By introducing innovative dishes in addition to their existing menu, the business aims to establish itself as a destination for delicious and satisfying dining experiences.","topics":["operations"],"syllabusPoints":["ops-proc-inputs"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"5654e3df5b","number":"23 (a)","text":"Calculate the efficiency (total expenses \u00f7 total sales) of this business.","marks":2,"verb":"calculate","type":"short-answer","section":"II","stimulus":"A gifts and homewares business sells goods such as candles, bags, cushions, soaps and jewellery. Financial information provided: Operating income (revenue) $1 500 000; Gross profit $1 100 000; Expenses $600 000; Total liabilities $2 000 000; Net profit $500 000; Owner's equity $1 800 000.","topics":["finance"],"syllabusPoints":["fin-proc-ratios"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"fe908d6344","number":"24 (a)","text":"Outline ONE promotion strategy this business could use to launch the new product range.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Scenario: A business wishes to introduce new products into the market.","topics":["marketing"],"syllabusPoints":["mkt-str-promotion"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"0da9d6d641","number":"21 (a)","text":"Outline a performance objective relevant to this business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"Scenario: Michael would like to open a new burger restaurant.","topics":["operations"],"syllabusPoints":["ops-str-performance"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"90b57d34f6","number":"22 (a)","text":"Outline how an increase in the minimum wage rate could affect business.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-economic","hr-inf-legal-framework"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"ac15d07cc7","number":"22 (a)","text":"Identify where the business could record the loan and the properties on its balance sheet.","marks":2,"verb":"identify","type":"short-answer","section":"II","stimulus":"A luxury Australian handbag business is going to expand. They intend to borrow 30 million US dollars to buy several new retail properties across Australia.","topics":["finance"],"syllabusPoints":["fin-proc-statements"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"b45e6216cf","number":"23 (a)","text":"Outline how corporate culture can affect staff turnover.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"6562bec038","number":"21 (a)","text":"Outline how this customer can be considered an input in the construction of the new home.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":"A building company has been contracted to build a new home for a customer. The contract requires the home to be completed within six months and within budget.","topics":["operations"],"syllabusPoints":["ops-proc-inputs"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"4bbe8170d5","number":"23 (b)","text":"Why might a business use a contractor to recruit staff?","marks":2,"verb":"why","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-outsourcing","hr-str-recruitment"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"f4df218567","number":"24 (b)","text":"Interpret this business's expense ratio (total expenses \u00f7 sales).","marks":2,"verb":"interpret","type":"short-answer","section":"II","stimulus":"Financial information for a robotics company: Sales $225 000; Cost of goods sold $105 000; Selling expenses $8 500; Administration expenses $6 000; Financial expenses $4 000; Accounts receivable $30 000; company credit policy 30 days; industry expense ratio 10%.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"85dea02f64","number":"21 (a)","text":"Outline the role of ONE external stakeholder who represents the interests of employees in workplace disputes.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-stakeholders","hr-str-disputes"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"1f60c0975e","number":"24 (a)","text":"Identify TWO transforming resources used in this business.","marks":2,"verb":"identify","type":"short-answer","section":"II","stimulus":"Question 24 scenario: A juice bar is operating in a shopping centre. The juice is served to customers in plastic cups with plastic straws. The high sales volume and quick turnover demand an efficient operations process.","topics":["operations"],"syllabusPoints":["ops-proc-inputs"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"977e577e13","number":"23 (a)","text":"Outline ONE employer obligation in an employment contract.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"8419a30343","number":"22 (a)","text":"Outline ONE ethical issue related to the preparation of financial reports.","marks":2,"verb":"outline","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-proc-ethical"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{ ":"Learn to 3","text":"identify the breadth of government policies that affect operations management","marks":null,"verb":"identify","type":"bank","section":"bank","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-inf-government"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"f75c5825f6","number":"Learn to 8","text":"recommend possible operations strategies for one hypothetical business","marks":null,"verb":"recommend","type":"bank","section":"bank","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-performance"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null}],"counts":{"fin-str-cashflow":12,"fin-str-profitability":13,"fin-str-workingcapital":17,"fin-role-objectives":11,"fin-str-global":10,"hr-eff-indicators":16,"hr-str-rewards":8,"hr-str-training":8,"hr-str-performance":5,"hr-str-leadership":3,"hr-inf-ethics":4,"hr-inf-technological":5,"fin-inf-debt":9,"fin-inf-equity":7,"fin-inf-government":3,"fin-inf-global":3,"mkt-str-product":6,"mkt-str-price":9,"mkt-str-promotion":11,"mkt-str-place":8,"mkt-inf-economic":7,"mkt-inf-sociocultural":10,"mkt-inf-consumerlaws":9,"mkt-inf-ethical":7,"ops-str-performance":15,"ops-str-quality":13,"ops-str-technology":11,"ops-str-global":7,"hr-proc-acquisition":9,"hr-proc-development":7,"hr-str-disputes":9,"fin-proc-planning":3,"fin-proc-statements":4,"ops-str-supplychain":6,"ops-str-inventory":8,"ops-proc-monitoring":4,"ops-proc-tasklayout":6,"mkt-proc-objectives":5,"mkt-proc-target":7,"mkt-str-global":13,"hr-role-interdependence":6,"mkt-role-interdependence":8,"mkt-proc-implement":2,"mkt-proc-strategies":7,"ops-proc-fourvs":10,"hr-str-recruitment":6,"hr-inf-whs":2,"ops-proc-sequencing":5,"mkt-str-emarketing":2,"mkt-str-segmentation":5,"ops-proc-inputs":9,"ops-proc-outputs":2,"fin-inf-internal":2,"hr-role-strategic":4,"ops-str-outsourcing":4,"mkt-inf-psychological":6,"mkt-inf-government":6,"ops-role-strategic":8,"fin-role-interdependence":3,"hr-str-global":1,"hr-proc-maintenance":4,"fin-proc-debtequity":11,"fin-proc-matching":3,"ops-inf-globalisation":9,"ops-inf-technology":6,"ops-inf-quality":5,"ops-inf-cost":4,"ops-inf-government":2,"ops-inf-legal":3,"ops-inf-envsus":8,"ops-inf-csr":8,"hr-role-outsourcing":7,"mkt-proc-situational":11,"fin-proc-limitations":6,"ops-str-change":5,"hr-proc-separation":4,"mkt-proc-research":7,"hr-inf-legal-framework":10,"hr-inf-social":4,"hr-inf-stakeholders":4,"ops-role-interdependence":4,"fin-proc-ratios":24,"fin-proc-comparative":15,"hr-inf-discrimination":3,"ops-str-newproduct":2,"mkt-role-approaches":4,"hr-inf-economic":2,"fin-proc-ethical":3,"mkt-role-markets":1,"mkt-role-strategic":2,"mkt-str-ppp":1,"ops-role-goods-services":1},"sources":["2019 HSC Business Studies","2020 HSC Business Studies","2021 HSC Business Studies","2022 HSC Business Studies","2023 HSC Business Studies","Abbotsleigh Trial 2023","Abbotsleigh Trial 2024","Barker Trial 2023","Barker Trial 2024","HSC Final Exam Preparation \u2014 MARKETING","HSC Final Exam Preparation \u2014 OPERATIONS","Independent Trial 2024","Knox Trial 2023","Loreto Trial 2024","Newington Trial 2023","Newington Trial 2024","Reddam Trial 2023","Reddam Trial 2024","Roseville Trial 2023","Roseville Trial 2024","SIC Trial 2024"]};
const IMAGES = {};
const TOPIC_ORDER = ["operations","marketing","finance","hr"];
const TOPIC_COLOR = {operations:"var(--ops)",marketing:"var(--mkt)",finance:"var(--fin)",hr:"var(--hr)"};
const SHORT = {operations:"Operations",marketing:"Marketing",finance:"Finance",hr:"HR"};

// Flat lookup: syllabus id -> {topic, section, label}
const POINT = {};
for (const t of TOPIC_ORDER){
  const sections = DATA.taxonomy[t].sections;
  for (const sec in sections) for (const p of sections[sec])
    POINT[p.id] = {topic:t, section:sec, label:p.label, short:p.short || p.label.split(" — ")[0]};
}

const state = {
  topic: "hr",
  point: null,          // null = whole topic
  q: "",
  source: "", marks: "", verb: "", type: "", hideDone: false, stimOnly: false,
};

// ---- completion tracking -------------------------------------------------
const KEY = "hsc-bst-saq-done-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){}
const saveDone = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e){} };

// ---- helpers -------------------------------------------------------------
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inTopic = q => q.topics.includes(state.topic);

function highlight(text){
  const html = esc(text);
  if (!state.q) return html;
  const terms = state.q.split(/\s+/).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if (!terms.length) return html;
  return html.replace(new RegExp("("+terms.join("|")+")","gi"), "<mark>$1</mark>");
}

function marksBucket(m, bucket){
  if (!bucket) return true;
  if (m == null) return false;
  if (bucket === "1-3")  return m <= 3;
  if (bucket === "4-5")  return m >= 4 && m <= 5;
  if (bucket === "6-9")  return m >= 6 && m <= 9;
  if (bucket === "10+")  return m >= 10;
  return true;
}

/** Questions for the current topic + point, before the dropdown filters. */
function scoped(){
  return DATA.questions.filter(q => {
    if (state.q){
      // Search runs across every topic so nothing is hidden behind a tab.
      const hay = (q.text + " " + (q.stimulus||"") + " " + q.sources.join(" ")).toLowerCase();
      if (!state.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
      return true;
    }
    if (!inTopic(q)) return false;
    if (state.point && !q.syllabusPoints.includes(state.point)) return false;
    return true;
  });
}

function filtered(){
  return scoped().filter(q => {
    if (state.source && !q.sources.includes(state.source)) return false;
    if (!marksBucket(q.marks, state.marks)) return false;
    if (state.verb && q.verb !== state.verb) return false;
    if (state.type && q.type !== state.type) return false;
    if (state.hideDone && done.has(q.id)) return false;
    if (state.stimOnly && !q.stimulus) return false;
    return true;
  });
}

// ---- rendering -----------------------------------------------------------
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TOPIC_ORDER.map(t => {
    const n = DATA.questions.filter(q => q.topics.includes(t)).length;
    return `<button class="tab" role="tab" data-topic="${t}" aria-selected="${t===state.topic && !state.q}">
      <span class="dot" style="background:${TOPIC_COLOR[t]}"></span>${SHORT[t]}<span class="n">${n}</span></button>`;
  }).join("");
  el.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    state.topic = b.dataset.topic; state.point = null; state.q = "";
    document.getElementById("search").value = "";
    render();
  });
}

function renderTree(){
  const sections = DATA.taxonomy[state.topic].sections;
  const parts = [];
  for (const sec in sections){
    const rows = sections[sec].map(p => {
      const all = DATA.questions.filter(q => q.syllabusPoints.includes(p.id));
      const n = all.length;
      const d = all.filter(q => done.has(q.id)).length;
      const pct = n ? Math.round(100*d/n) : 0;
      return `<button class="pt ${state.point===p.id?"active":""} ${n?"":"empty"}" data-point="${p.id}" title="${esc(p.label)}">
        <span>${esc(p.label)}</span>
        ${n ? `<span class="bar" title="${d} of ${n} done"><i style="width:${pct}%"></i></span>` : ""}
        <span class="cnt">${n}</span></button>`;
    }).join("");
    const secTotal = sections[sec].reduce((a,p) => a + (DATA.counts[p.id]||0), 0);
    const open = !state.point || sections[sec].some(p => p.id === state.point);
    parts.push(`<details class="sec" ${open?"open":""}><summary>${esc(sec)} <span class="cnt" style="margin-left:auto">${secTotal}</span></summary>${rows}</details>`);
  }
  const tree = document.getElementById("tree");
  tree.innerHTML = parts.join("");
  tree.querySelectorAll(".pt").forEach(b => b.onclick = () => {
    state.point = b.dataset.point; state.q = ""; document.getElementById("search").value = "";
    render();
  });
  document.getElementById("asideTitle").textContent = DATA.taxonomy[state.topic].label + " syllabus";
  const allb = document.getElementById("allbtn");
  allb.classList.toggle("active", !state.point && !state.q);
  allb.onclick = () => { state.point = null; state.q = ""; document.getElementById("search").value=""; render(); };
}

function renderFilterOptions(){
  const pool = scoped();
  const fill = (id, values, label) => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    const opts = [...new Set(values.filter(Boolean))].sort();
    sel.innerHTML = `<option value="">${label}</option>` + opts.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    sel.value = opts.includes(cur) ? cur : "";
    if (sel.value !== cur){ if (id==="fSource") state.source=""; if (id==="fVerb") state.verb=""; }
  };
  fill("fSource", pool.flatMap(q => q.sources), "All papers");
  fill("fVerb", pool.map(q => q.verb), "Any directive verb");
}

/** The question as it sits on the paper: the real crop where we have one,
 *  otherwise the wording typeset the same way, with answer lines sized to the
 *  marks. Both render on white — it is paper either way. */
function paperBlock(q){
  if (q.image){
    const src = IMAGES[q.image] || ("img/" + q.image);
    return `<figure class="paper"><img loading="lazy" src="${src}"
      alt="Screenshot of question ${esc(q.number)} as printed in the exam paper"></figure>`;
  }
  const lines = Math.min(14, Math.max(2, Math.round((q.marks || 2) * 1.6)));
  return `<div class="paper typeset">
    <div class="ex-row">
      <span class="ex-num">${esc(q.number || "")}</span>
      <span class="ex-text">${highlight(q.text)}</span>
      ${q.marks!=null ? `<span class="ex-marks">${q.marks}</span>` : ""}
    </div>
    ${q.stimulus ? `<div class="ex-stim">${highlight(q.stimulus)}</div>` : ""}
    <div class="ex-rules">${"<i></i>".repeat(lines)}</div>
  </div>`;
}

function card(q){
  const isDone = done.has(q.id);
  // Tags are ordered so the topic you are currently reading comes first.
  const pts = q.syllabusPoints.filter(p => POINT[p])
    .sort((a,b) => (POINT[a].topic===state.topic?0:1) - (POINT[b].topic===state.topic?0:1));
  const tags = pts.map(p => {
    const t = POINT[p].topic;
    const cross = t !== state.topic && !state.q;
    return `<span class="chip tag" data-goto="${p}" style="--tc:${TOPIC_COLOR[t]}"
      title="${esc(SHORT[t])} › ${esc(POINT[p].label)} — click to jump">${cross?`<b>${esc(SHORT[t])}</b> `:""}${esc(POINT[p].short)}</span>`;
  }).join("");
  return `<article class="q ${isDone?"is-done":""}" data-id="${q.id}">
    <div class="q-top">
      <span class="q-num">${esc(q.number || "Question")}</span>
      <span class="q-src">${esc(q.sources.join(" · "))}</span>
      ${q.marks!=null ? `<span class="q-marks">${q.marks} mark${q.marks===1?"":"s"}</span>` : ""}
    </div>
    ${paperBlock(q)}
    <div class="q-foot">
      <span class="chip prov ${q.image?"scan":""}">${q.image ? "screenshot from the paper" : "retyped — no scan of this paper"}</span>
      ${q.type==="extended-response" ? `<span class="chip">extended response</span>` : ""}
      ${tags}
      <button class="donebtn">${isDone ? "✓ Done" : "Mark done"}</button>
    </div>
  </article>`;
}

function renderList(){
  const qs = filtered();
  const list = document.getElementById("list");
  const doneN = qs.filter(q => done.has(q.id)).length;

  document.getElementById("countline").textContent =
    qs.length ? `${qs.length} question${qs.length===1?"":"s"} · ${doneN} completed` : "";

  if (!qs.length){
    list.innerHTML = `<div class="empty-state">${state.q
      ? `No question matches “${esc(state.q)}”.`
      : `No question in the papers covers this syllabus point yet.<br>Try the parent section, or a neighbouring point.`}</div>`;
    return;
  }
  list.innerHTML = qs.map(card).join("");

  list.querySelectorAll(".q").forEach(el => {
    const id = el.dataset.id;
    el.querySelector(".donebtn").onclick = () => {
      done.has(id) ? done.delete(id) : done.add(id);
      saveDone(); renderTree(); renderList();
    };
    el.querySelectorAll("[data-goto]").forEach(t => t.onclick = () => {
      const p = t.dataset.goto;
      state.topic = POINT[p].topic; state.point = p; state.q = "";
      document.getElementById("search").value = "";
      render(); window.scrollTo({top:0,behavior:"smooth"});
    });
  });
}

function renderHead(){
  const crumb = document.getElementById("crumb");
  const title = document.getElementById("ptitle");
  const sub   = document.getElementById("psub");

  if (state.q){
    crumb.innerHTML = `Search`;
    title.textContent = `“${state.q}”`;
    sub.textContent = "Searching every topic. Clear the box to go back to the syllabus.";
  } else if (state.point){
    const p = POINT[state.point];
    crumb.innerHTML = `<b>${esc(DATA.taxonomy[p.topic].label)}</b> › ${esc(p.section)}`;
    title.textContent = p.label;
    const all = DATA.questions.filter(q => q.syllabusPoints.includes(state.point));
    const marks = all.map(q => q.marks).filter(m => m!=null);
    sub.textContent = all.length
      ? `${all.length} question${all.length===1?"":"s"} across ${new Set(all.flatMap(q=>q.sources)).size} paper${new Set(all.flatMap(q=>q.sources)).size===1?"":"s"}`
        + (marks.length ? ` · ${Math.min(...marks)}–${Math.max(...marks)} marks` : "")
      : "No questions found for this point.";
  } else {
    crumb.innerHTML = `<b>${esc(DATA.taxonomy[state.topic].label)}</b>`;
    title.textContent = "All " + DATA.taxonomy[state.topic].label + " questions";
    sub.textContent = "Pick a syllabus point on the left to narrow this down.";
  }
}

function render(){
  document.documentElement.setAttribute("data-topic", state.topic);
  renderTabs(); renderTree(); renderHead(); renderFilterOptions(); renderList();
}

// ---- wiring --------------------------------------------------------------
const search = document.getElementById("search");
let t;
search.oninput = () => { clearTimeout(t); t = setTimeout(() => { state.q = search.value.trim(); render(); }, 130); };
search.onkeydown = e => { if (e.key === "Escape"){ search.value=""; state.q=""; render(); } };

const bind = (id, key) => document.getElementById(id).onchange = e => {
  state[key] = e.target.type === "checkbox" ? e.target.checked : e.target.value; renderList();
};
bind("fSource","source"); bind("fMarks","marks"); bind("fVerb","verb"); bind("fType","type");
bind("fHideDone","hideDone"); bind("fStim","stimOnly");

document.getElementById("printbtn").onclick = () => window.print();
document.getElementById("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hsc-bst-theme", next); } catch(e){}
};
try { const th = localStorage.getItem("hsc-bst-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

document.getElementById("foot").textContent =
  `${DATA.questions.length} questions from ${DATA.sources.length} papers · classified against the NSW HSC Business Studies syllabus · progress is saved in this browser`;

render();
</script>
