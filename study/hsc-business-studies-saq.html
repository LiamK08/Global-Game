at have contributed to the changing labour force participation rates in the period 1981\u20132021.","marks":5,"verb":"explain","type":"short-answer","section":"II","stimulus":"Table of Australian labour force participation rates by gender: 1981 \u2014 males 78%, females 44%; 2001 \u2014 males 73%, females 55%; 2021 \u2014 males 71%, females 62%.","topics":["hr"],"syllabusPoints":["hr-inf-social"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"e0f81b1277","number":"23 (c)","text":"Using a business case study, analyse the cause of one workplace dispute and the strategies used to resolve this dispute.","marks":5,"verb":"analyse","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-disputes"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"b6c8c20d79","number":"22 (c)","text":"Account for the changes in this business's current and forecast profitability and gearing.","marks":5,"verb":"account","type":"short-answer","section":"II","stimulus":"Ratio table for the luxury Australian handbag business (which is borrowing US$30 million to buy retail properties in Australia), comparing Current (before loan) with Forecast (12 months after loan): Gross profit 65% to 70%; Net profit 21% to 18%; Debt to equity 0.85:1 (85%) to 1.5:1 (150%).","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"e19036eb8c","number":"23 (c)","text":"Assess the impact of ONE social influence on human resource management.","marks":5,"verb":"assess","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-social"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"6c00a6090b","number":"21 (b)","text":"A market leading business manufactures electronics.\n\nExplain how environmental sustainability can influence the operations of this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"One-line scenario: a market leading business that manufactures electronics.","topics":["operations"],"syllabusPoints":["ops-inf-envsus"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"7e223c6358","number":"23 (b)","text":"A viewer sees this advertisement and orders the product. They receive the hair dryer and a single knife in the mail and are disappointed to find that the knife isn't sharp enough to cut ordinary fruit.\nExplain how elements of this television advertisement may be in breach of Australian Consumer Law.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"A television commercial for a hair dryer on a shopping channel indicates that if customers order the hair dryer in the next ten minutes, they will also receive a free set of knives at no extra cost. The narrator tells viewers that these knives can cut through anything with a single slice.","topics":["marketing"],"syllabusPoints":["mkt-inf-consumerlaws"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"1ca0c3bfb7","number":"24 (c)","text":"Analyse the impact of technological influences on ONE of the human resource processes at TechWorld.","marks":4,"verb":"analyse","type":"short-answer","section":"II","stimulus":"TechWorld is reviewing its human resources strategies to ensure alignment with its goals for: growth; innovation; supportive work culture; current legal framework.","topics":["hr"],"syllabusPoints":["hr-inf-technological","hr-proc-acquisition","hr-proc-development"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"beb90e3177","number":"22 (c)","text":"Assess the profitability of this business against industry averages.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Financial data for Smith Office Supplies Pty Ltd for the period ending 30 June 2023 (business figure, then industry average): Sales 180 000 / 240 000; Cost of Goods Sold 120 000 / 120 000; GROSS PROFIT 60 000 / 120 000; Operating expenses \u2014 Administrative 17 000 / 15 000, Sales and distribution 7 000 / 15 000, Financial 7 000 / 10 000; NET PROFIT 29 000 / 80 000. Formulae given: Gross Profit Ratio = Gross Profit / Sales; Net Profit Ratio = Net Profit / Sales; Expense Ratio = Total expenses / Sales.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"2a1346b79e","number":"24 (b)","text":"Assess the profitability of this business.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Key financial information for a manufacturing business planning to invest $10m into a new manufacturing facility over the next 3 years. Figures in $'000: Revenue 9 000; Accounts receivable 2 500; Cost of goods sold 3 600; Retained profit 1 400; Expenses 3 780. Industry averages: Gross Profit Ratio (gross profit / sales) = 50%; Net Profit Ratio (net profit / sales) = 25%; Expense Ratio (expense / sales) = 45%.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"d42fd3e6d4","number":"24 (b)","text":"Describe TWO limitations of SK Pty Ltd's 2024 Balance Sheet.","marks":4,"verb":"describe","type":"short-answer","section":"II","stimulus":"Balance Sheet for SK Pty Ltd as at year ending 30 June 2024. Current Assets: Cash $15,000; Receivables $10,000; Inventories $80,000. Non-Current Assets: Property $280,000; R&D $60,000; Equipment $100,000. Current Liabilities: Creditors $50,000. Non-Current Liabilities: Bank Loan $100,000. Owners Equity: Capital $350,000; Net Profit $65,000; Drawings $20,000. Other financial information: 2023 return on equity ratio = 11%; 2024 return on equity ratio industry average 13%; 2024 debt to equity ratio industry average 2:1.","topics":["finance"],"syllabusPoints":["fin-proc-limitations"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"da4ab66111","number":"21 (b)","text":"Describe how a SWOT analysis would benefit the business in developing its global marketing strategy.","marks":4,"verb":"describe","type":"short-answer","section":"II","stimulus":"Healthy Pies and Burgers Pty Ltd is a fast-food chain that has been operating successfully in Australia for over 10 years. Management has decided to expand its operations overseas and access global markets using a customised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational","mkt-str-global"],"sources":["Newington Trial 2024"],"kind":"Newington Trial","year":2024},{"id":"ff36e6ba1a","number":"24 (c)","text":"Describe the importance of the planning and implementing process for this business.","marks":4,"verb":"describe","type":"short-answer","section":"II","stimulus":"Key financial information for a manufacturing business planning to invest $10m into a new manufacturing facility over the next 3 years. Figures in $'000: Revenue 9 000; Accounts receivable 2 500; Cost of goods sold 3 600; Retained profit 1 400; Expenses 3 780. Industry averages: Gross Profit Ratio 50%; Net Profit Ratio 25%; Expense Ratio 45%.","topics":["finance"],"syllabusPoints":["fin-proc-planning"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"63f59b994f","number":"24 (b)","text":"Describe two benefits this company might experience from outsourcing this human resource function.","marks":4,"verb":"describe","type":"short-answer","section":"II","stimulus":"Green Earth Ltd is a mid-sized manufacturing company that produces eco-friendly household products. Due to rapid growth and an increase in customer demand, the company's management team is considering outsourcing certain human resource functions to improve efficiency and focus on core activities.","topics":["hr"],"syllabusPoints":["hr-role-outsourcing"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"72e43eec67","number":"24 (b)","text":"Discuss TWO benefits for a business of embracing corporate social responsibilities and ethical practices","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-ethics"],"sources":["Newington Trial 2024"],"kind":"Newington Trial","year":2024},{"id":"677bdce70b","number":"24 (b)","text":"Discuss TWO benefits for business of embracing corporate social responsibilities and ethical practices.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-ethics"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"b774949ba5","number":"23 (b)","text":"Discuss TWO sources of finance that Food Plus Pty Ltd can use to fund its expansion.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":"Food Plus Pty Ltd is a health food grocery store, operating successfully in NSW for the last 10 years. Management is now aiming to expand overseas by opening three stores in the USA in the next two years. There are a number of global market influences which Food Plus Pty Ltd needs to consider in relation to this global expansion.","topics":["finance"],"syllabusPoints":["fin-inf-debt","fin-inf-equity","fin-proc-matching","fin-proc-debtequity"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"050007c06c","number":"22 (c)","text":"Discuss the impact of ONE working capital management strategy on Buffy\u2019s Florist Pty Ltd.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":"Balance Sheet for Buffy\u2019s Florist, 1/1/24 \u2013 30/6/24. Current Assets: Cash $10 000; Accounts Receivable $70 000; Inventory $80 000 (total $160 000). Non-Current Assets: Retail Premises $800 000; Delivery vans $100 000. Current Liabilities: Accounts Payable $90 000; Bank overdraft $60 000 (total $150 000). Non-Current Liabilities: Mortgage $600 000. Owners\u2019 Equity: Capital $260 000; Retained Profit $50 000. Additional financial information: Industry Average Liquidity/Working Capital Ratio = 2:1.","topics":["finance"],"syllabusPoints":["fin-str-workingcapital"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"c494e2f601","number":"24 (c)","text":"Distinguish between awards and enterprise agreements as an employment contract","marks":4,"verb":"distinguish","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["Newington Trial 2024"],"kind":"Newington Trial","year":2024},{"id":"4a604f9c52","number":"24 (c)","text":"Evaluate ONE promotional strategy Indulgence Ltd could use to increase sales of their new range of sugar free chocolates.","marks":4,"verb":"evaluate","type":"short-answer","section":"II","stimulus":"Case scenario: Indulgence Ltd manufactures and sells high quality chocolates in their own retail outlets. Recently, the business has introduced a range of sugar free chocolates.","topics":["marketing"],"syllabusPoints":["mkt-str-promotion"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"f3d4b2a61e","number":"23 (a)","text":"Evaluate the solvency (total liabilities \u00f7 total equity) for this business.","marks":4,"verb":"evaluate","type":"short-answer","section":"II","stimulus":"Acme Kitchenware manufactures and sells pots and pans to department stores. Table 'Financial Information for Acme Kitchenware 2022':\nCurrent assets \u2014 Cash $30 000; Accounts Receivable $45 000; Inventory $50 000.\nNon-current assets \u2014 Vehicles $45 000; Plant and Equipment $20 000; Goodwill $30 000.\nCurrent liabilities \u2014 Accounts Payable $60 000; Overdraft (figure not legible in the source file).\nNon-current liabilities \u2014 Term loan $130 000.\nOwner's equity \u2014 Capital and Retained earnings of $70 000 and $150 000 (total equity $220 000).\nAdditional information: 2021 solvency ratio 105%; industry solvency ratio 70%. (The paper's marking guidelines state the 2022 solvency ratio is 93.2%.)","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"3f0ed834cf","number":"23 (b)","text":"Explain ONE advantage and ONE disadvantage of a business having a diverse and culturally competent workforce.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-discrimination","hr-inf-social"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"3462d3f667","number":"23 (c)","text":"Explain TWO global influences on the financial management of this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Food Plus Pty Ltd is a health food grocery store, operating successfully in NSW for the last 10 years. Management is now aiming to expand overseas by opening three stores in the USA in the next two years. There are a number of global market influences which Food Plus Pty Ltd needs to consider in relation to this global expansion.","topics":["finance"],"syllabusPoints":["fin-inf-global","fin-str-global"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"ebd330681c","number":"24 (c)","text":"Explain how TWO indicators can be used to evaluate the effectiveness of the human resource function.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"5e8125aa2e","number":"23 (c)","text":"Explain how a business can use TWO human resources management processes to achieve a competitive advantage.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-proc-acquisition","hr-proc-development","hr-proc-maintenance","hr-proc-separation"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"fdc4f57201","number":"22 (b)","text":"Explain how technology can assist this business to improve its operations processes. Support your answer with relevant examples.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Style Furniture Pty Ltd is an Australian business that manufactures and sells furniture in Sydney. The business is holding excess stock which is difficult to sell. Management is attempting to improve its furniture production and reduce the cost of its operations processes. It is also investigating if outsourcing its operations processes to an overseas manufacturer or investing in technology will assist it in achieving its goals.","topics":["operations"],"syllabusPoints":["ops-str-technology","ops-proc-tasklayout"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"edad8b3ef1","number":"21 (c)","text":"Explain how the adoption of leading-edge technology can sustain a business's competitive advantage.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-technology"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"6110a66e4f","number":"21 (d)","text":"Explain how the operations strategies of global sourcing and economies of scale might be beneficial to this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Sushi Train \u2014 a successful global Japanese fast food company rapidly expanding in Australia. Customers are attracted to its unique process layout, in which little plates of sushi rotate around on a train-style system. Customers take meals directly from the train and watch their meals being produced in front of them.","topics":["operations"],"syllabusPoints":["ops-str-global","ops-str-supplychain"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"d0081c4ba1","number":"23 (c)","text":"How might aspects of Ecoclean's advertisement breach Australian consumer laws?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"EcoClean is a startup selling eco-friendly cleaning products. An advertisement for EcoClean (reproduced as an image in the paper) claims the products are \"The best toxic free cleaning products on the market!\" and states \"We guarantee results*\", with a fine-print footnote \"*for houses that are already dirt free.\"","topics":["marketing"],"syllabusPoints":["mkt-inf-consumerlaws"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"96593b9be2","number":"21 (c)","text":"Justify this business' decision to adopt a customised marketing strategy to enter the global market.","marks":4,"verb":"justify","type":"short-answer","section":"II","stimulus":"Healthy Pies and Burgers Pty Ltd is a fast-food chain that has been operating successfully in Australia for over 10 years. Management has decided to expand its operations overseas and access global markets using a customised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-str-global"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"192024fc76","number":"24 (c)","text":"Justify why this business should use debt finance to fund its expansion.","marks":4,"verb":"justify","type":"short-answer","section":"II","stimulus":"Balance Sheet for SK Pty Ltd as at year ending 30 June 2024. Current Assets: Cash $15,000; Receivables $10,000; Inventories $80,000. Non-Current Assets: Property $280,000; R&D $60,000; Equipment $100,000. Current Liabilities: Creditors $50,000. Non-Current Liabilities: Bank Loan $100,000. Owners Equity: Capital $350,000; Net Profit $65,000; Drawings $20,000. Other financial information: 2023 return on equity ratio = 11%; 2024 return on equity ratio industry average 13%; 2024 debt to equity ratio industry average 2:1. Additional information for this part: SK Pty Ltd is considering expansion by opening a new store and has been given approval from the bank to borrow $500,000 to finance their expansion.","topics":["finance"],"syllabusPoints":["fin-proc-debtequity","fin-inf-debt"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"fc69796551","number":"21 (b)","text":"Outline how a SWOT analysis would benefit the business in developing its global marketing strategy.","marks":4,"verb":"outline","type":"short-answer","section":"II","stimulus":"Healthy Pies and Burgers Pty Ltd is a fast-food chain that has been operating successfully in Australia for over 10 years. Management has decided to expand its operations overseas and access global markets using a customised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational","mkt-str-global"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"5f5da4176b","number":"22 (d)","text":"Recommend TWO indicators that could be used by Spend More to measure the effectiveness of its human resource management.","marks":4,"verb":"recommend","type":"short-answer","section":"II","stimulus":"The retail business, Spend More, has been rapidly expanding in the past 2 years and requires additional staff and premises. However, the increasing changes have led to conflict and uncertainty between management and employees in the workplace.","topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"6e782cc3a7","number":"24 (b)","text":"Recommend TWO indicators that could be used by TechWorld to measure the effectiveness of its human resource management.","marks":4,"verb":"recommend","type":"short-answer","section":"II","stimulus":"TechWorld is reviewing its human resources strategies to ensure alignment with its goals for: growth; innovation; supportive work culture; current legal framework.","topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"ab28fbe04a","number":"22 (d)","text":"Recommend TWO profitability management strategies for this business.","marks":4,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Financial data for Smith Office Supplies Pty Ltd for the period ending 30 June 2023 (business figure, then industry average): Sales 180 000 / 240 000; Cost of Goods Sold 120 000 / 120 000; GROSS PROFIT 60 000 / 120 000; Operating expenses \u2014 Administrative 17 000 / 15 000, Sales and distribution 7 000 / 15 000, Financial 7 000 / 10 000; NET PROFIT 29 000 / 80 000.","topics":["finance"],"syllabusPoints":["fin-str-profitability"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"dddbac02b8","number":"22 (c)","text":"What are the advantages of this business outsourcing its operations process overseas.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":"Style Furniture Pty Ltd is an Australian business that manufactures and sells furniture in Sydney. The business is holding excess stock which is difficult to sell. Management is attempting to improve its furniture production and reduce the cost of its operations processes. It is also investigating if outsourcing its operations processes to an overseas manufacturer or investing in technology will assist it in achieving its goals.","topics":["operations"],"syllabusPoints":["ops-str-outsourcing","ops-str-global"],"sources":["Independent Trial 2024","Newington Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"54593d4846","number":"21 (c)","text":"Why is identifying a target market important when developing a product?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-proc-target","mkt-str-segmentation"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"e4b306ecfc","number":"23 (b)","text":"A business has decided to expand its product range. Discuss the operational strategy of new product or service design and development for this business","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-newproduct"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"ca4ecc92d9","number":"22 (c)","text":"Assess the influence of cost-based competition on this business.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Tasty Bites Caf\u00e9 is a food-based business that aims to revitalise its competitive edge by expanding its menu to include a wider range of culinary offerings. By introducing innovative dishes in addition to their existing menu, the business aims to establish itself as a destination for delicious and satisfying dining experiences.","topics":["operations"],"syllabusPoints":["ops-inf-cost"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"f52768eb3a","number":"22 (d)","text":"Compare and contrast TWO sources of debt finance used by Local Grocer Pty Ltd.","marks":4,"verb":"compare","type":"short-answer","section":"II","stimulus":"Balance Sheet for Local Grocer Pty Ltd, June 2023.\nCurrent Assets: Cash $25 000; Accounts Receivable $45 000; Inventory $55 000.\nNon-Current Assets: Building $400 000; Delivery van $50 000.\nCurrent Liabilities: Accounts Payable $35 000; Bank overdraft $65 000.\nNon-Current Liabilities: Mortgage $225 000.\nOwners' Equity: Capital $200 000; Retained Profit $50 000.\nAdditional financial information: Return on Owners' Equity ratio for 2022 = 0.1:1.","topics":["finance"],"syllabusPoints":["fin-inf-debt","fin-proc-matching"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"ffd2cf520a","number":"21 (d)","text":"Discuss the impact of variety and visibility on the transformation process of the car retailer.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":"A car retailer expects high demand and orders extra stock of the latest release lower priced, electric car. The car retailer also provides longer warranties than competitors as well as car repairs and services.","topics":["operations"],"syllabusPoints":["ops-proc-fourvs"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"d20f93f66f","number":"23 (a)","text":"Evaluate the owner's return on equity (net profit \u00f7 total equity).","marks":4,"verb":"evaluate","type":"short-answer","section":"II","stimulus":"Acme Kitchenware manufactures and sells pots and pans to department stores. Financial Information for Acme Kitchenware 2022 -- Current assets: Cash $125 000, Accounts receivable $60 500, Stock $110 000 (total current assets $295 500). Non-current assets: Vehicles $260 000, Equipment $216 580. Current liabilities: Accounts payable $120 000, Overdraft $120 780 (total current liabilities $240 780). Non-current liabilities: Mortgage $20 000. Owner's equity: Capital $430 800, Retained earnings $80 500 (total equity $511 300). Additional information: Net profit $75 000; industry average return on equity 18%. (Return on equity therefore works out at approximately 14.7%.)","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"35bd4d7e8d","number":"24 (b)","text":"Explain TWO legal influences that QuadTel will need to consider in their marketing.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"QuadTel is a US based business that sells innovative high quality drone technology to consumers. It is considering entering the Australian market and is currently reviewing the best way to market their products.","topics":["marketing"],"syllabusPoints":["mkt-inf-consumerlaws"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"741b51d378","number":"23 (a)","text":"Explain how HiFashion could implement TWO appropriate dispute resolution methods that would reduce the current number of disputes.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"HiFashion is a fast fashion retail store with 40 stores around Australia employing 200 staff. Management is concerned about a reduction in productivity and staff feedback; staff cited rewards, leadership style and dispute resolution methods as key to their dissatisfaction. Data extract: staff turnover 10% (2021) to 20% (2022); employee satisfaction 80% (2021) to 65% (2022); number of disputes 10 per year (2021) to 25 per year (2022).","topics":["hr"],"syllabusPoints":["hr-str-disputes"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"6a6c88c2c1","number":"22 (b)","text":"Explain how the influence of volume could impact the transformation process for this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Tasty Bites Caf\u00e9 is a food-based business that aims to revitalise its competitive edge by expanding its menu to include a wider range of culinary offerings. By introducing innovative dishes in addition to their existing menu, the business aims to establish itself as a destination for delicious and satisfying dining experiences.","topics":["operations"],"syllabusPoints":["ops-proc-fourvs"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"c8c441a486","number":"24 (b)","text":"Explain the interdependence of marketing and operations for this business","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Tom is establishing a new business, 'Super Specs', that produces and sells sunglasses to consumers. The business has a wide range of products, differing in price and quality. After conducting extensive market research, he has determined that consumers would rather pay more for a higher quality product.","topics":["marketing","operations"],"syllabusPoints":["mkt-role-interdependence","ops-role-interdependence"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"d823bdeca1","number":"23 (b)","text":"How could Acme Kitchenware improve their level of working capital?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"Acme Kitchenware manufactures and sells pots and pans to department stores. Financial Information for Acme Kitchenware 2022 -- Current assets: Cash $125 000, Accounts receivable $60 500, Stock $110 000 (total current assets $295 500). Non-current assets: Vehicles $260 000, Equipment $216 580. Current liabilities: Accounts payable $120 000, Overdraft $120 780 (total current liabilities $240 780). Non-current liabilities: Mortgage $20 000. Owner's equity: Capital $430 800, Retained earnings $80 500 (total equity $511 300). Additional information: Net profit $75 000; industry average return on equity 18%. (Working capital is therefore only $54 720, a current ratio of about 1.23:1.)","topics":["finance"],"syllabusPoints":["fin-str-workingcapital"],"sources":["Barker Trial 2023","Barker Trial 2024"],"kind":"Barker Trial","year":2023},{"id":"551701f6ec","number":"21 (d)","text":"How could this business demonstrate leadership in relation to environmental sustainability in their operations?","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Make Ur Own Ice Cream Pty Ltd is a premium self-serve ice cream shop where customers can grab whatever lollies and chocolates they want and add them into their ice creams. They only stock high-quality ingredients. The company weighs the product and charges a price based on how heavy it is.","topics":["operations"],"syllabusPoints":["ops-inf-envsus"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"29ee537d3f","number":"22 (a)","text":"How do sociocultural influences affect the customer's choice for this business?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"Spook is an exclusive luxury fashion retailer with a target market of high-income customers. Recently they have experienced a decrease in sales and profits due to an economic downturn. The business has decided to review their marketing plan in response to this change.","topics":["marketing"],"syllabusPoints":["mkt-inf-sociocultural"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"cbc6f16f5b","number":"23 (b)","text":"Identify the stage of the product life cycle that this product is in and justify how this relates to the pricing strategy that is being used by this business.","marks":4,"verb":"justify","type":"short-answer","section":"II","stimulus":"EZ Sleep Ltd is an Australian company that has recently launched a new leading-edge electric blanket for $4,000 \u2014 a price 10 times higher than any other electric blanket on the market. The blanket connects to a mobile phone app which monitors heart rate and sleep quality and adjusts bed temperature to the user's preferences. Australian celebrities have been posting about the product on social media and EZ Sleep's website has been flooded with orders.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational","mkt-str-price"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"8058d346b6","number":"22 (d)","text":"Recommend TWO profitability management strategies that this business could use to improve its profitability result.","marks":4,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Income statement for Manly Beach Pancakes Store Pty Ltd, year ended 30 June 2022, shown alongside Industry Average Results ($):\nSales 150 000 (industry 200 000); Cost of goods sold 105 000 (industry 100 000); Gross profit 45 000 (industry 100 000).\nOperating expenses \u2014 Administrative 5 000 (industry 12 000); Selling & distribution 7 000 (industry 15 000); Financial 3 000 (industry 3 000); Net profit 30 000 (industry 70 000).\nThe business therefore has a gross profit ratio of 30% versus an industry average of 50%, and a net profit ratio of 20% versus an industry average of 35%.","topics":["finance"],"syllabusPoints":["fin-str-profitability"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"0853d4ca6e","number":"24 (b)","text":"To what extent is human resources management effective in this business? Support your answer with examples from the data.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Table of data for a business, 2021 vs 2022. Human Resources costs: $2 600 000 (2021) vs $2 000 000 (2022). Training expenditure per employee: $1900 vs $1500. Absenteeism per employee: 10 days vs 14 days. Accidents per 1000 employees: 50 vs 30. Number of strike days: 2 vs 10. Staff turnover: 15% vs 10%.","topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"282265ee1c","number":"24 (c)","text":"Using the data, analyse the interdependence between human resources management and financial management in this business.","marks":4,"verb":"analyse","type":"short-answer","section":"II","stimulus":"Table of data for a business, 2021 vs 2022. Human Resources costs: $2 600 000 (2021) vs $2 000 000 (2022). Training expenditure per employee: $1900 vs $1500. Absenteeism per employee: 10 days vs 14 days. Accidents per 1000 employees: 50 vs 30. Number of strike days: 2 vs 10. Staff turnover: 15% vs 10%.","topics":["hr","finance"],"syllabusPoints":["hr-role-interdependence","fin-role-interdependence"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"b8de5201aa","number":"22 (b)","text":"Using the financial information provided, explain why solvency is an important objective for this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Balance Sheet for Simon's Sporting Goods Pty Ltd (a large sporting goods retailer), as at 30 June 2023, figures in '000s. ASSETS: Cash at bank 800; Inventories 300; Accounts receivable 800 (current assets 1900); Plant & Equipment 500; Motor Vehicles 1200; Land & Buildings 4000 (non-current assets 5700); Total assets 7600. LIABILITIES: Accounts payable 1000; Overdraft 300 (current liabilities 1300); Two-year bank loan 1500; Mortgage 3000 (non-current liabilities 4500). OWNER'S EQUITY: Capital 1000; Retained Profit 800 (total equity 1800). Other information: Net profit for 2023 = $300 000; Return on Equity (net profit \u00f7 total equity) for 2022 = 20%. Industry Averages: Debt to Equity (total liabilities \u00f7 total equity) = 2:1; Current Ratio (current assets \u00f7 current liabilities) = 1:1.","topics":["finance"],"syllabusPoints":["fin-role-objectives","fin-proc-ratios"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"389f5605b2","number":"22 (c)","text":"Using the financial information provided, assess the recent financial performance of Simon's Sporting Goods Pty Ltd.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Balance Sheet for Simon's Sporting Goods Pty Ltd (a large sporting goods retailer), as at 30 June 2023, figures in '000s. ASSETS: Cash at bank 800; Inventories 300; Accounts receivable 800 (current assets 1900); Plant & Equipment 500; Motor Vehicles 1200; Land & Buildings 4000 (non-current assets 5700); Total assets 7600. LIABILITIES: Accounts payable 1000; Overdraft 300 (current liabilities 1300); Two-year bank loan 1500; Mortgage 3000 (non-current liabilities 4500). OWNER'S EQUITY: Capital 1000; Retained Profit 800 (total equity 1800). Other information: Net profit for 2023 = $300 000; Return on Equity (net profit \u00f7 total equity) for 2022 = 20%. Industry Averages: Debt to Equity (total liabilities \u00f7 total equity) = 2:1; Current Ratio (current assets \u00f7 current liabilities) = 1:1.","topics":["finance"],"syllabusPoints":["fin-proc-comparative","fin-proc-ratios"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"afafe733f0","number":"22 (c)","text":"Using the information above, assess the profitability of this business.","marks":4,"verb":"assess","type":"short-answer","section":"II","stimulus":"Income statement for Manly Beach Pancakes Store Pty Ltd, year ended 30 June 2022, shown alongside Industry Average Results ($):\nSales 150 000 (industry 200 000); Cost of goods sold 105 000 (industry 100 000); Gross profit 45 000 (industry 100 000).\nOperating expenses \u2014 Administrative 5 000 (industry 12 000); Selling & distribution 7 000 (industry 15 000); Financial 3 000 (industry 3 000); Net profit 30 000 (industry 70 000).\nFormulae supplied: Gross Profit Ratio = gross profit / sales; Net Profit Ratio = net profits / sales.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"f521c135bb","number":"21 (c)","text":"Why might certain aspects of quality control be challenging for this business?","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Make Ur Own Ice Cream Pty Ltd is a premium self-serve ice cream shop where customers can grab whatever lollies and chocolates they want and add them into their ice creams. They only stock high-quality ingredients. The company weighs the product and charges a price based on how heavy it is.","topics":["operations"],"syllabusPoints":["ops-str-quality"],"sources":["Roseville Trial 2023"],"kind":"Roseville Trial","year":2023},{"id":"17ca3b94b4","number":"24 (c)","text":"Why should this business adopt a production approach rather than a selling approach?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":"Tom is establishing a new business, 'Super Specs', that produces and sells sunglasses to consumers. The business has a wide range of products, differing in price and quality. After conducting extensive market research, he has determined that consumers would rather pay more for a higher quality product.","topics":["marketing"],"syllabusPoints":["mkt-role-approaches"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"1fc25f6d72","number":"24 (c)","text":"Why should this business consider the use of both direct and indirect distribution channels?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":"QuadTel is a US based business that sells innovative high quality drone technology to consumers. It is considering entering the Australian market and is currently reviewing the best way to market their products.","topics":["marketing"],"syllabusPoints":["mkt-str-place"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"5df93e4dea","number":"21 (d)","text":"With reference to a business you have studied, discuss the impact of corporate social responsibility on the operations process.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-inf-csr"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"e913395023","number":"21 (c)","text":"Compare each layout in terms of efficiency and profitability.","marks":4,"verb":"compare","type":"short-answer","section":"II","stimulus":"Scenario: Michael would like to open a new burger restaurant. Lead-in: \"Michael is considering which process layout would be the most efficient for this restaurant.\" Two floor-plan diagrams are provided. Both options contain the same stations - stove, burger assembly station, raw meat refrigerator, finished burgers, seating area, cash registers and entrance - but arranged in a different order, so the flow of raw meat to the assembly station and of finished burgers through to the cash registers and seating area differs between the two layouts.","topics":["operations"],"syllabusPoints":["ops-proc-tasklayout"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"bd080f6552","number":"24 (c)","text":"Why should this business adopt a marketing approach instead of a selling approach?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":"Scenario: A business wishes to introduce new products into the market.","topics":["marketing"],"syllabusPoints":["mkt-role-approaches"],"sources":["2022 HSC Business Studies"],"kind":"NESA HSC","year":2022},{"id":"f0ad31df15","number":"21 (c)","text":"Explain TWO quality management strategies that could be used to ensure the quality of the outsourced work.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"A building company has been contracted to build a new home for a customer, to be completed within six months and within budget. The operations manager will need to outsource certain elements of the construction process.","topics":["operations"],"syllabusPoints":["ops-str-quality","ops-str-outsourcing"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"12ea528b4f","number":"21 (b)","text":"How could a Gantt chart help the building company meet the terms of the contract?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"A building company has been contracted to build a new home for a customer. The contract requires the home to be completed within six months and within budget.","topics":["operations"],"syllabusPoints":["ops-proc-sequencing"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"fdbe5d49b0","number":"24 (c)","text":"How might aspects of this advertisement breach Australian consumer laws?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"A printed advertisement for a fridge headed 'Be the envy of your neighbours' and claiming 'The best quality fridge in the market'. It promotes a limited-time 30% off store offer, 'Comes with a massive 6-month warranty***' and '**Zero carbon emissions'. Small-print disclaimers state: *30% off not applicable to this product; **Zero carbon emissions only in houses that are zero carbon powered; ***No repairs or returns will be considered after 6 months.","topics":["marketing"],"syllabusPoints":["mkt-inf-consumerlaws"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"a1a845a321","number":"21 (b)","text":"Distinguish between voluntary and involuntary separation.","marks":4,"verb":"distinguish","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-proc-separation"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"145e133307","number":"24 (d)","text":"Explain TWO ways in which comparative ratio analysis can be used by this business to assess its financial position.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Financial information for a robotics company: Sales $225 000; Cost of goods sold $105 000; Selling expenses $8 500; Administration expenses $6 000; Financial expenses $4 000; Accounts receivable $30 000; company credit policy 30 days; industry expense ratio 10%.","topics":["finance"],"syllabusPoints":["fin-proc-comparative"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"d065a23b5e","number":"21 (c)","text":"Explain how technological influences and globalisation can lead to a company reducing staff numbers. Support your answer with relevant examples.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-technological","hr-inf-economic","hr-proc-separation"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"6d87f1d296","number":"23 (a)","text":"How could the strategic role of operations management assist this business?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"A denim jeans clothing store is concerned about declining sales. It has identified that the lower sales are a result of: outdated store presentation; increased foreign competition; and a reluctance to adopt modern in-store payment methods.","topics":["operations"],"syllabusPoints":["ops-role-strategic"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"026ad40a55","number":"22 (c)","text":"Justify this business's decision to adopt a standardised marketing strategy.","marks":4,"verb":"justify","type":"short-answer","section":"II","stimulus":"A popular Australian guitar manufacturer is about to enter the US market using a standardised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-str-global"],"sources":["2020 HSC Business Studies"],"kind":"NESA HSC","year":2020},{"id":"cafefc8a27","number":"23 (b)","text":"Distinguish between awards and enterprise agreements.","marks":4,"verb":"distinguish","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"ba85128418","number":"21 (b)","text":"Explain the interdependence between marketing and finance for this business.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":"Question 21 scenario: A business sells luxury cars. The cars are stylish, high performance and include advanced safety features integrating leading edge technology.","topics":["marketing","finance"],"syllabusPoints":["mkt-role-interdependence","fin-role-interdependence"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"7f96cf91d3","number":"24 (b)","text":"How does variety impact the transformation process of this business?","marks":4,"verb":"how","type":"short-answer","section":"II","stimulus":"Question 24 scenario: A juice bar is operating in a shopping centre. The juice is served to customers in plastic cups with plastic straws. The high sales volume and quick turnover demand an efficient operations process.","topics":["operations"],"syllabusPoints":["ops-proc-fourvs"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"b98e878cc8","number":"21 (c)","text":"Why is it important for this business to conduct market research?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":"Question 21 scenario: A business sells luxury cars. The cars are stylish, high performance and include advanced safety features integrating leading edge technology.","topics":["marketing"],"syllabusPoints":["mkt-proc-research"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"587e4de3f8","number":"24 (c)","text":"Why might this business be reluctant to become more socially responsible?","marks":4,"verb":"why","type":"short-answer","section":"II","stimulus":"Question 24 scenario: A juice bar is operating in a shopping centre. The juice is served to customers in plastic cups with plastic straws. The high sales volume and quick turnover demand an efficient operations process. (Single-use plastic cups and straws are the environmental/social responsibility issue.)","topics":["operations"],"syllabusPoints":["ops-inf-csr","ops-inf-envsus"],"sources":["2019 HSC Business Studies"],"kind":"NESA HSC","year":2019},{"id":"272133ff4d","number":"Question 22 (c)","text":"Analyse TWO physical distribution issues that need to be considered by Trendy Masks.","marks":4,"verb":"analyse","type":"short-answer","section":"II","stimulus":"Trendy Masks is a newly established producer of personal protective equipment, including stylish face masks. They are looking to capitalise on the recent growth in this market. (Question 22 is worth 10 marks in total.)","topics":["marketing"],"syllabusPoints":["mkt-str-place"],"sources":["HSC Final Exam Preparation \u2014 MARKETING"],"kind":"Question bank","year":null},{"id":"6535a2b68d","number":"Question 23 (b)","text":"Discuss the financial costs associated with changing the operations process of a business.","marks":4,"verb":"discuss","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-str-change"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"31f4d3306e","number":"Question 23 (c)","text":"Explain how Gantt charts and critical path analysis can be used to improve business operations.","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["operations"],"syllabusPoints":["ops-proc-sequencing"],"sources":["HSC Final Exam Preparation \u2014 OPERATIONS"],"kind":"Question bank","year":null},{"id":"c4190ed291","number":"Qu 21 (c)","text":"Explain why is it important for a business to conduct a situational analysis?","marks":4,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-proc-situational"],"sources":["HSC Final Exam Preparation \u2014 MARKETING"],"kind":"Question bank","year":null},{"id":"1df62c4ff0","number":"23 (c)","text":"An influencer has been engaged to promote the sale of these hair dryers.\nExplain how this influencer could successfully promote this product.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"A television commercial for a hair dryer on a shopping channel offers a free set of knives with any order placed within ten minutes, claiming the knives can cut through anything with a single slice.","topics":["marketing"],"syllabusPoints":["mkt-str-promotion","mkt-str-emarketing"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"5a9392658f","number":"21 (c)","text":"Assess the use of sequencing and scheduling techniques in the manufacturing process of the sports shoe manufacturer.","marks":3,"verb":"assess","type":"short-answer","section":"II","stimulus":"Case scenario: a leading sports shoe manufacturer enables customers to design their own shoes. This has required the business to purchase an additional factory and machinery.","topics":["operations"],"syllabusPoints":["ops-proc-sequencing"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"2da97f8977","number":"21 (b)","text":"Clarify the purpose of a SWOT analysis for Exquisite Gardens Pty Ltd.","marks":3,"verb":"clarify","type":"short-answer","section":"II","stimulus":"Exquisite Gardens Pty Ltd, located in Bowral NSW, provides upmarket plants and garden furniture for consumers residing in country estates. Their customers are primarily professionals of high socioeconomic status who love gardening. The business is currently planning to expand its market throughout Australia, however management is concerned about the potential impact of a decline in Australia's current economic growth and an increase in government regulations on the business.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"bc1aa707ca","number":"23 (a)","text":"Compare the production approach and the marketing approach.","marks":3,"verb":"compare","type":"short-answer","section":"II","stimulus":"EcoClean, a startup business committed to creating eco-friendly cleaning products, is finalising its marketing strategy. EcoClean seeks to adopt a marketing approach that reflects its values and effectively engages its target audience.","topics":["marketing"],"syllabusPoints":["mkt-role-approaches"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"ba49b637d1","number":"21 (b)","text":"Describe ONE influence on operations that is relevant to this business.","marks":3,"verb":"describe","type":"short-answer","section":"II","stimulus":"Sushi Train \u2014 a successful global Japanese fast food company rapidly expanding in Australia. Customers are attracted to its unique process layout, in which little plates of sushi rotate around on a train-style system. Customers take meals directly from the train and watch their meals being produced in front of them.","topics":["operations"],"syllabusPoints":["ops-inf-globalisation","ops-inf-quality","ops-inf-technology"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"bfd0f06c88","number":"21 (b)","text":"Discuss the impact of environmental sustainability on FashionForward's operations.","marks":3,"verb":"discuss","type":"short-answer","section":"II","stimulus":"FashionForward is an Australian luxury clothing retailer with retail stores in each state and an online shop. It wants to expand retail stores globally using its current overseas suppliers in China, France and Italy. Recent media reports state that Australians throw away an average of 23 kilograms of clothing to landfill each year. As a result, FashionForward is facing challenges related to environmental sustainability.","topics":["operations"],"syllabusPoints":["ops-inf-envsus"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"66c0b0e73c","number":"22 (b)","text":"Distinguish between a common law contract and an enterprise agreement.","marks":3,"verb":"distinguish","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"679567d02f","number":"24 (b)","text":"Distinguish between primary and secondary data collected in market research. Provide an example of each type of research for Indulgence Ltd.","marks":3,"verb":"distinguish","type":"short-answer","section":"II","stimulus":"Case scenario: Indulgence Ltd manufactures and sells high quality chocolates in their own retail outlets. Recently, the business has introduced a range of sugar free chocolates.","topics":["marketing"],"syllabusPoints":["mkt-proc-research"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"8813bb0175","number":"21 (a)","text":"Explain ONE factor that influences customer choice.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-inf-psychological","mkt-inf-sociocultural","mkt-inf-economic","mkt-inf-government"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"7bdeb6b534","number":"22 (b)","text":"Explain ONE limitation of financial statements in providing a complete picture of Coffee Mania's financial health.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"Coffee Mania, a local cafe. Latest financial statement key figures: Current Assets $200,000; Non-Current Assets $800,000; Current Liabilities $150,000; Non-Current Liabilities $500,000; Owner's Equity $350,000.","topics":["finance"],"syllabusPoints":["fin-proc-limitations"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"0f7332272e","number":"23 (b)","text":"Explain how EcoClean can use market research to better understand consumer behaviours.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"EcoClean, a startup business committed to creating eco-friendly cleaning products, is finalising its marketing strategy. EcoClean seeks to adopt a marketing approach that reflects its values and effectively engages its target audience.","topics":["marketing"],"syllabusPoints":["mkt-proc-research"],"sources":["Loreto Trial 2024"],"kind":"Loreto Trial","year":2024},{"id":"8b3d714c58","number":"23 (b)","text":"Explain the importance of situational analysis for this business.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"A business manufactures loungewear and is known for distinctive patterns and comfort. Management is introducing a new premium product range of athletic wear. Economic conditions have worsened and unemployment has risen.","topics":["marketing"],"syllabusPoints":["mkt-proc-situational"],"sources":["SIC Trial 2024"],"kind":"SIC Trial","year":2024},{"id":"cb85c3d58c","number":"23 (b)","text":"Explain the interdependence of operations and marketing for this business.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"Precision Shave produces and sells a collection of eco-friendly razors made from sustainable materials. The business is also introducing a subscription service that delivers customised shaving kits catering to the specific needs of individual consumers.","topics":["operations","marketing"],"syllabusPoints":["ops-role-interdependence","mkt-role-interdependence"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"1508224240","number":"21 (c)","text":"How might the influence of variety impact TWO aspects of the operations process for this business?","marks":3,"verb":"how","type":"short-answer","section":"II","stimulus":"Sushi Train \u2014 a successful global Japanese fast food company rapidly expanding in Australia. Customers are attracted to its unique process layout, in which little plates of sushi rotate around on a train-style system. Customers take meals directly from the train and watch their meals being produced in front of them.","topics":["operations"],"syllabusPoints":["ops-proc-fourvs"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"025abe0ee0","number":"24 (a)","text":"Outline the interdependence between marketing and ONE other key business function of Indulgence Ltd.","marks":3,"verb":"outline","type":"short-answer","section":"II","stimulus":"Case scenario: Indulgence Ltd manufactures and sells high quality chocolates in their own retail outlets. Recently, the business has introduced a range of sugar free chocolates.","topics":["marketing"],"syllabusPoints":["mkt-role-interdependence"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"2cbb519e30","number":"21 (d)","text":"Recommend ONE operations strategy that could be used to improve the performance of the sports shoe manufacturer.","marks":3,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Case scenario: a leading sports shoe manufacturer enables customers to design their own shoes. This has required the business to purchase an additional factory and machinery.","topics":["operations"],"syllabusPoints":["ops-str-newproduct","ops-str-technology","ops-str-quality"],"sources":["Reddam Trial 2024"],"kind":"Reddam Trial","year":2024},{"id":"06470e1de4","number":"23 (d)","text":"This business also engages in sugging to increase sales.\nWhy is sugging considered unethical?","marks":3,"verb":"why","type":"short-answer","section":"II","stimulus":"The business is a shopping-channel retailer selling hair dryers via a television commercial that also offers a free set of knives.","topics":["marketing"],"syllabusPoints":["mkt-inf-ethical"],"sources":["Roseville Trial 2024"],"kind":"Roseville Trial","year":2024},{"id":"2e9c3d2aff","number":"24 (b)","text":"Why is corporate culture an indicator of the effectiveness of human resource management?","marks":3,"verb":"why","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-eff-indicators"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"265d5b8d5f","number":"22 (b)","text":"Why would a product layout be useful for this business?","marks":3,"verb":"why","type":"short-answer","section":"II","stimulus":"Focus Frames produces eyewear such as sunglasses and prescription glasses using an automated assembly line that is run by a combination of staff and robotics. They are seeking to improve the speed and efficiency of their manufacturing process.","topics":["operations"],"syllabusPoints":["ops-proc-tasklayout"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"739e2b2bb2","number":"21 (b)","text":"With reference to a business you have studied, describe how a business would benefit from using opinion leaders in their marketing.","marks":3,"verb":"describe","type":"short-answer","section":"II","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-promotion"],"sources":["Barker Trial 2024"],"kind":"Barker Trial","year":2024},{"id":"444beaab6b","number":"21 (b)","text":"Describe the role of grievance procedures in human resource management.","marks":3,"verb":"describe","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-disputes"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"7e10599136","number":"24 (d)","text":"Evaluate ONE price strategy ZZ's could adopt for their school formal OR wedding functions.","marks":3,"verb":"evaluate","type":"short-answer","section":"II","stimulus":"ZZ's operates a function centre for large birthday parties for residents in the local area. ZZ's has renovated and expanded their function centre so that they can provide additional functions such as school formals and weddings.","topics":["marketing"],"syllabusPoints":["mkt-str-price"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"4b99b115ff","number":"23 (b)","text":"Explain ONE advantage of using group rewards rather than individual rewards in human resource management.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-str-rewards"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"0e1ff36d05","number":"21 (b)","text":"Explain ONE ethical issue related to financial reports for the stakeholders of this business.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"Financial information for Playsmart Child Care Ltd (balance sheet extract). Current Assets: Cash $40 000; Accounts Receivable $100 000; Inventory $100 000. Non-Current Assets: Building $320 000; Delivery van $40 000; Goodwill $100 000. Current Liabilities: Accounts Payable $100 000; Bank overdraft $130 000. Non-Current Liabilities: Mortgage $300 000. Owners' Equity: Capital $150 000; Retained Profit $20 000. Additional information: Debt to equity ratio = Total Liabilities / Total Equity; gearing industry average 2:1.","topics":["finance"],"syllabusPoints":["fin-proc-ethical"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"7c94bea7c4","number":"24 (b)","text":"Explain a possible conflict between ONE short-term and ONE long-term financial objective.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["finance"],"syllabusPoints":["fin-role-objectives"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"ee442ff94f","number":"21 (e)","text":"Explain how Bakers Dozen's current financial position impacts on the solvency of the business.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"Balance sheet for Bakers Dozen Pty. Ltd. as at 30 June 2023. Current Assets: Cash $19 000, Debtors $2 500, Stock $34 000. Non-current Assets: Equipment $62 000, Buildings $318 000, Land $160 000. Total Assets $595 500. Current Liabilities: Overdraft $30 000. Non-current Liabilities: Debentures $94 000, Mortgage $291 500 (total liabilities $415 500). Owner's Equity: Capital $95 000, Retained profit $85 000 (total equity $180 000). Net profit for 2022-2023 was $160 000; industry average for liquidity is 2.5:1; industry gearing (total liabilities \u00f7 owner's equity) is 1:1. The business plans to expand nationally.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-role-objectives"],"sources":["Abbotsleigh Trial 2023"],"kind":"Abbotsleigh Trial","year":2023},{"id":"e727272d01","number":"21 (b)","text":"Explain the benefits of achieving economies of scale for both the business and consumers.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"An Australian tyre manufacturer is expanding its business. In order to reduce operating costs and increase sales and profit, rubber will be sourced from the global market. The business wants to: maintain quality outputs; achieve economies of scale.","topics":["operations"],"syllabusPoints":["ops-str-global","ops-inf-cost"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"8e961c10b9","number":"24 (c)","text":"Explain the impact of ONE consumer law on ZZ's marketing strategies.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"ZZ's operates a function centre for large birthday parties for residents in the local area. ZZ's has renovated and expanded their function centre so that they can provide additional functions such as school formals and weddings.","topics":["marketing"],"syllabusPoints":["mkt-inf-consumerlaws"],"sources":["Reddam Trial 2023"],"kind":"Reddam Trial","year":2023},{"id":"ba6f2e926b","number":"22 (b)","text":"How could Gantt charts assist this business with the change?","marks":3,"verb":"how","type":"short-answer","section":"II","stimulus":"HiTel is a leading Australian electronics company expanding rapidly in the Asia Pacific region. It is moving its Sydney-based manufacturing to India. The cost of the change is forecast at $40 million, it will take six months to implement, and 250 staff will be impacted.","topics":["operations"],"syllabusPoints":["ops-proc-sequencing"],"sources":["Knox Trial 2023"],"kind":"Knox Trial","year":2023},{"id":"85c30d3b83","number":"23 (b)","text":"How could a niche market approach increase sales for this cereal manufacturer?","marks":3,"verb":"how","type":"short-answer","section":"II","stimulus":"A cereal manufacturer has decided to change the packaging of its product in an attempt to reverse a drop in sales and remain competitive with existing businesses. It is also considering growing its target market by catering for health-conscious consumers in Australia and eventually expanding into the global market.","topics":["marketing"],"syllabusPoints":["mkt-role-markets","mkt-proc-target"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"7a3dfd344f","number":"23 (d)","text":"Recommend and justify an inventory management system this business should use","marks":3,"verb":"recommend","type":"short-answer","section":"II","stimulus":"Rebecca owns and operates a health food business. Due to an increase in competition from large retail chains, she needs to revise her operational strategies. A problem that her customers have identified is products that are consistently 'out of stock', as well as damaged goods in need of replacing.","topics":["operations"],"syllabusPoints":["ops-str-inventory"],"sources":["Newington Trial 2023"],"kind":"Newington Trial","year":2023},{"id":"0dbbbdedcc","number":"22 (b)","text":"The advertisement for a store manager is shown.\nOutline TWO human resource issues found in this advertisement.","marks":3,"verb":"outline","type":"short-answer","section":"II","stimulus":"A job advertisement from 'Teddy Bear Store' (Est. 1990), a business that aims to bring joy to children, seeking a Store Manager. Role: manage a team of 8 staff members; manage day-to-day operations. Responsibilities: organise inventory; train staff; assist customers. General information: $65 000 salary; union membership not permitted; no superannuation included.","topics":["hr"],"syllabusPoints":["hr-inf-legal-framework","hr-inf-stakeholders"],"sources":["2023 HSC Business Studies"],"kind":"NESA HSC","year":2023},{"id":"8f20f7d31c","number":"24 (b)","text":"Why would a business outsource their human resource functions?","marks":3,"verb":"why","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-role-outsourcing"],"sources":["Barker Trial 2023"],"kind":"Barker Trial","year":2023},{"id":"e333ed562c","number":"23 (b)","text":"Explain how the expense ratio can help this business determine their efficiency.","marks":3 ],"kind":"NESA HSC","year":2022},{"id":"f4e9bc3f9e","number":"22 (b)","text":"Explain a financial risk associated with borrowing funds from the USA.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":"A luxury Australian handbag business is going to expand. They intend to borrow 30 million US dollars to buy several new retail properties across Australia.","topics":["finance"],"syllabusPoints":["fin-str-global","fin-proc-planning"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"5bae8c556c","number":"24 (a)","text":"Explain the benefits of customisation as a global marketing strategy.","marks":3,"verb":"explain","type":"short-answer","section":"II","stimulus":null,"topics":["marketing"],"syllabusPoints":["mkt-str-global"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"6f6be66b42","number":"24 (b)","text":"How does this advertisement use sociocultural factors to influence customer choice?","marks":3,"verb":"how","type":"short-answer","section":"II","stimulus":"A printed advertisement for a fridge headed 'Be the envy of your neighbours' and claiming 'The best quality fridge in the market'. It promotes a limited-time 30% off store offer, 'Comes with a massive 6-month warranty***' and '**Zero carbon emissions'. Small-print disclaimers state: *30% off not applicable to this product; **Zero carbon emissions only in houses that are zero carbon powered; ***No repairs or returns will be considered after 6 months.","topics":["marketing"],"syllabusPoints":["mkt-inf-sociocultural"],"sources":["2021 HSC Business Studies"],"kind":"NESA HSC","year":2021},{"id":"5309d2b363","number":"22 (a)","text":"Clarify the purpose of a SWOT analysis for this business.","marks":3,"verb":"clarify","type":"short-answer","section":"II","stimulus":"A popular Australian guitar manufacturer is about to enter the US market using a standardised marketing strategy.","topics":["marketing"],"syllabusPoints":["mkt-proc-sit rofit $65,000; Drawings $20,000. Other financial information: 2023 return on equity ratio = 11%; 2024 return on equity ratio industry average 13%; 2024 debt to equity ratio industry average 2:1.","topics":["finance"],"syllabusPoints":["fin-proc-ratios","fin-proc-comparative"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"b59c05c4bb","number":"24 (a)","text":"Define corporate social responsibility.","marks":2,"verb":"define","type":"short-answer","section":"II","stimulus":null,"topics":["hr"],"syllabusPoints":["hr-inf-ethics"],"sources":["Independent Trial 2024"],"kind":"Independent Trial","year":2024},{"id":"87319fb1db","number":"22 (c)","text":"Describe ONE common law obligation of the employers at Spend More.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"The retail business, Spend More, has been rapidly expanding in the past 2 years and requires additional staff and premises. However, the increasing changes have led to conflict and uncertainty between management and employees in the workplace.","topics":["hr"],"syllabusPoints":["hr-inf-legal-framework"],"sources":["Abbotsleigh Trial 2024"],"kind":"Abbotsleigh Trial","year":2024},{"id":"678ef79abd","number":"21 (a)","text":"Describe ONE form of secondary data Exclusive Gardens Pty Ltd could use in their market research process.","marks":2,"verb":"describe","type":"short-answer","section":"II","stimulus":"Exquisite Gardens Pty Ltd, located in Bowral NSW, provides upmarket plants and garden furniture for consumers residing in country estates. Their customers are primarily professionals of high socioeconomic status who love gardening. The business is currently planning to expand its market throughout Australia, however management is concerned about the potential impact of a decline in Australia's current economic growth and an increase in government regulations on the business.","topics":["marketing"],"syllabusPoints":["mkt-proc-research"],"sources"
